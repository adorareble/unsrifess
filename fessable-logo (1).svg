<svg width="680" height="360" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
  <!-- Single clean speech bubble -->
  <rect x="286" y="58" width="108" height="76" rx="20" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1.5"/>
  <polygon points="306,134 292,158 330,134" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1.5"/>
  <line x1="294" y1="135" x2="328" y2="135" stroke="#F1EFE8" stroke-width="3"/>

  <!-- 3 colored dots -->
  <circle cx="318" cy="96" r="9" fill="#E24B4A"/>
  <circle cx="340" cy="96" r="9" fill="#EF9F27"/>
  <circle cx="362" cy="96" r="9" fill="#1D9E75"/>

  <!-- Wordmark -->
  <text x="340" y="230"
    font-family="Inter, SF Pro Display, system-ui, sans-serif"
    font-size="52" font-weight="700"
    text-anchor="middle" letter-spacing="-1.5"
    fill="#2C2C2A">fessable</text>

  <!-- Tagline -->
  <text x="340" y="270"
    font-family="Inter, system-ui, sans-serif"
