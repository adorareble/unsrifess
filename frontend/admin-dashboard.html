<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta property="og:title" content="Root Admin — fessable">
<meta property="og:description" content="Root administration panel">
<meta name="theme-color" content="#FAFAF9">
<title>Root Admin — fessable</title>
<style>
:root{--bg-page:#FAFAF9;--bg-surface:#F1EFE8;--bg-card:#FFFFFF;--text-primary:#2C2C2A;--text-secondary:#888780;--text-hint:#B4B2A9;--border:#D3D1C7;--red:#E24B4A;--red-tint:#FAECE7;--red-text:#A32D2D;--amber:#EF9F27;--amber-tint:#FAEEDA;--amber-text:#854F0B;--teal:#1D9E75;--teal-tint:#EAF3DE;--teal-text:#0F6E56}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-page);color:var(--text-primary);min-height:100vh;padding:0}
.container{width:100%;max-width:1200px;margin:0 auto;padding:20px}

/* ── Topbar ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px;border-bottom:0.5px solid var(--border);
  width:100%;
}
.topbar-left{display:flex;align-items:center;gap:8px}
.topbar-left .wordmark{font-size:15px;font-weight:700;color:var(--text-primary)}
.topbar-left .title-sep{width:1px;height:18px;background:var(--border);margin:0 4px}
.topbar-left .page-title{font-size:1rem;font-weight:600;color:var(--text-secondary)}
.topbar-right{display:flex;align-items:center;gap:12px}
.logout-btn{padding:6px 14px;background:transparent;border:0.5px solid var(--border);border-radius:9999px;color:var(--text-primary);cursor:pointer;font-size:.8rem;font-weight:500;transition:border-color .2s}
.logout-btn:hover{border-color:var(--red);color:var(--red)}

/* ── Stats ── */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
@media(max-width:480px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--bg-surface);border:0.5px solid var(--border);border-radius:12px;padding:14px;text-align:center}
.stat-card .num{font-size:1.5rem;font-weight:700;color:var(--text-primary)}
.stat-card .label{font-size:.72rem;color:var(--text-secondary);margin-top:2px;text-transform:capitalize}

/* ── Actions bar ── */
.action-bar{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.btn-create{background:var(--text-primary);color:var(--bg-page);padding:8px 20px;border:none;border-radius:12px;font-size:.85rem;font-weight:600;cursor:pointer;transition:opacity .2s}
.btn-create:hover{opacity:.85}

/* ── Tenant table ── */
.tenants-table{background:var(--bg-card);border:0.5px solid var(--border);border-radius:12px;overflow-x:auto}
.tenants-table table{width:100%;border-collapse:collapse;min-width:700px}
.tenants-table th,.tenants-table td{padding:10px 14px;text-align:left;border-bottom:0.5px solid var(--border);font-size:.85rem}
.tenants-table th{background:var(--bg-surface);font-size:.72rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;font-weight:600}
.tenants-table tr:last-child td{border-bottom:none}

/* ── Tenant cards (mobile) ── */
@media(max-width:700px){
  .tenants-table table,.tenants-table thead,.tenants-table tbody,.tenants-table th,.tenants-table td,.tenants-table tr{display:block}
  .tenants-table thead{display:none}
  .tenants-table tr{
    background:var(--bg-card);border:0.5px solid var(--border);
    border-radius:12px;padding:14px;margin-bottom:8px;
  }
  .tenants-table tr:last-child{margin-bottom:0}
  .tenants-table td{
    padding:4px 0;border:none;font-size:.85rem;
    display:flex;align-items:center;gap:6px;
  }
  .tenants-table td::before{
    content:attr(data-label);
    font-size:.72rem;font-weight:600;color:var(--text-secondary);
    text-transform:uppercase;letter-spacing:.3px;
    min-width:70px;flex-shrink:0;
  }
  .tenants-table td.actions{flex-wrap:wrap}
  .tenants-table td.actions::before{content:'';display:none}
}

.badge{display:inline-block;padding:2px 10px;border-radius:9999px;font-size:.72rem;font-weight:600}
.badge.active{background:var(--teal-tint);color:var(--teal-text)}
.badge.inactive{background:var(--red-tint);color:var(--red-text)}

.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions button{padding:6px 14px;border-radius:9999px;border:none;font-size:.78rem;cursor:pointer;font-weight:600;white-space:nowrap;transition:opacity .2s}
.actions button:hover{opacity:.85}
.btn-activate{background:var(--teal);color:var(--bg-page)}
.btn-deactivate{background:var(--red);color:var(--bg-page)}
.btn-login-as{background:var(--text-primary);color:var(--bg-page)}

.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="dashboardArea">
  <div class="topbar">
    <div class="topbar-left">
      <svg width="24" height="24" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="4" width="56" height="44" rx="14" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="3"/>
        <path d="M14,48 L8,60 L26,48 Z" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="3" stroke-linejoin="round"/>
        <line x1="15" y1="47.2" x2="25" y2="47.2" stroke="#F1EFE8" stroke-width="5"/>
        <circle cx="22" cy="26" r="6" fill="#E24B4A"/>
        <circle cx="32" cy="26" r="6" fill="#EF9F27"/>
        <circle cx="42" cy="26" r="6" fill="#1D9E75"/>
      </svg>
      <span class="wordmark">fessable</span>
      <span class="title-sep"></span>
      <span class="page-title">Root Dashboard</span>
    </div>
    <div class="topbar-right">
      <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>
  </div>
  <div class="container">
    <div class="stats-grid" id="statsGrid"></div>
    <div class="action-bar">
      <button class="btn-create" onclick="showCreateTenant()">+ Create Tenant</button>
    </div>
    <div class="tenants-table">
      <table>
        <thead><tr><th>ID</th><th>Name</th><th>Slug</th><th>X Handle</th><th>Status</th><th>Tweets</th><th>Admins</th><th>Created</th><th>Actions</th></tr></thead>
        <tbody id="tenantsBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
function getToken(){return localStorage.getItem('admin_token')}

async function api(url,opts={}){
  const t=getToken()
  if(!t){window.location.href='/admin-login';return}
  opts.headers=opts.headers||{}
  opts.headers['Authorization']='Bearer '+t
  try{
    const resp=await fetch(url,opts)
    if(resp.status===401){localStorage.removeItem('admin_token');window.location.href='/admin-login';return null}
    return await resp.json()
  }catch(e){return null}
}

function logout(){localStorage.removeItem('admin_token');localStorage.removeItem('admin_role');window.location.href='/admin-login'}

async function loadStats(){
  const stats=await api('/panel/api/admin/stats')
  if(!stats)return
  document.getElementById('statsGrid').innerHTML=Object.entries(stats).map(([k,v])=>
    '<div class="stat-card"><div class="num">'+v+'</div><div class="label">'+k.replace(/_/g,' ')+'</div></div>'
  ).join('')
}

async function loadTenants(){
  const tenants=await api('/panel/api/admin/tenants')
  if(!tenants||!tenants.length){document.getElementById('tenantsBody').innerHTML='<tr><td colspan="9" style="text-align:center;color:#888780;padding:32px">No tenants yet</td></tr>';return}
  document.getElementById('tenantsBody').innerHTML=tenants.map(t=>{
    const badge=t.is_active?'<span class="badge active">Active</span>':'<span class="badge inactive">Inactive</span>'
    const created=t.created_at?new Date(t.created_at).toLocaleDateString():'-'
    const xHandle=t.x_screen_name?'@'+t.x_screen_name:'-'
    return '<tr><td data-label="ID">'+t.id+'</td><td data-label="Name">'+esc(t.name)+'</td><td data-label="Slug">'+esc(t.slug)+'</td><td data-label="X Handle">'+esc(xHandle)+'</td><td data-label="Status">'+badge+'</td><td data-label="Tweets">'+(t.total_tweets||0)+'</td><td data-label="Admins">'+(t.total_admins||0)+'</td><td data-label="Created">'+created+'</td><td class="actions" data-label="Actions">'+
      (t.is_active?'<button class="btn-deactivate" onclick="toggleTenant('+t.id+',false)">Deactivate</button>':'<button class="btn-activate" onclick="toggleTenant('+t.id+',true)">Activate</button>')+
      '<button class="btn-login-as" onclick="loginAs('+t.id+')">Login As</button></td></tr>'
  }).join('')
}

async function toggleTenant(id,activate){
  await api('/panel/api/admin/tenants/'+id+'/'+(activate?'activate':'deactivate'),{method:'POST'})
  loadTenants()
}

async function loginAs(id){
  const data=await api('/panel/api/admin/tenants/'+id+'/login-as',{method:'POST'})
  if(data&&data.token){
    localStorage.setItem('admin_token',data.token)
    window.location.href='/'+data.slug+'/panel/dashboard'
  }
}

function showCreateTenant(){
  const div=document.createElement('div')
  div.style.cssText='position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;padding:20px'
  div.innerHTML='<div style="background:var(--bg-card);border:0.5px solid var(--border);border-radius:16px;padding:28px;max-width:460px;width:100%;max-height:90vh;overflow-y:auto">'+
    '<h2 style="font-size:1.1rem;margin-bottom:16px;color:var(--text-primary)">Create Tenant</h2>'+
    '<input id="ctName" placeholder="Service Name" style="width:100%;padding:10px;margin-bottom:10px;background:var(--bg-surface);border:0.5px solid var(--border);border-radius:10px;color:var(--text-primary);display:block;font-family:inherit;font-size:.85rem;outline:none">'+
    '<input id="ctSlug" placeholder="Slug (e.g. my-conf)" style="width:100%;padding:10px;margin-bottom:10px;background:var(--bg-surface);border:0.5px solid var(--border);border-radius:10px;color:var(--text-primary);display:block;font-family:inherit;font-size:.85rem;outline:none">'+
    '<input id="ctX" placeholder="X Handle (optional)" style="width:100%;padding:10px;margin-bottom:10px;background:var(--bg-surface);border:0.5px solid var(--border);border-radius:10px;color:var(--text-primary);display:block;font-family:inherit;font-size:.85rem;outline:none">'+
    '<input id="ctUser" placeholder="Admin Username" style="width:100%;padding:10px;margin-bottom:10px;background:var(--bg-surface);border:0.5px solid var(--border);border-radius:10px;color:var(--text-primary);display:block;font-family:inherit;font-size:.85rem;outline:none">'+
    '<input id="ctPass" type="password" placeholder="Admin Password" style="width:100%;padding:10px;margin-bottom:10px;background:var(--bg-surface);border:0.5px solid var(--border);border-radius:10px;color:var(--text-primary);display:block;font-family:inherit;font-size:.85rem;outline:none">'+
    '<input id="ctDisplay" placeholder="Admin Display Name" style="width:100%;padding:10px;margin-bottom:14px;background:var(--bg-surface);border:0.5px solid var(--border);border-radius:10px;color:var(--text-primary);display:block;font-family:inherit;font-size:.85rem;outline:none">'+
    '<div style="display:flex;gap:8px"><button onclick="this.closest(\'div[style]\').remove()" style="flex:1;padding:10px;border-radius:9999px;border:0.5px solid var(--border);background:transparent;color:var(--text-primary);cursor:pointer;font-size:.9rem;font-weight:500">Cancel</button>'+
    '<button onclick="createTenant(this)" style="flex:1;padding:10px;border-radius:12px;border:none;background:var(--text-primary);color:var(--bg-page);cursor:pointer;font-size:.9rem;font-weight:600">Create</button></div></div>'
  document.body.appendChild(div)
}

async function createTenant(btn){
  const div=btn.closest('div[style]')
  const name=div.querySelector('#ctName').value.trim()
  const slug=div.querySelector('#ctSlug').value.trim()
  const x=div.querySelector('#ctX').value.trim()
  const user=div.querySelector('#ctUser').value.trim()
  const pass=div.querySelector('#ctPass').value
  const display=div.querySelector('#ctDisplay').value.trim()
  if(!name||!slug||!user||!pass||!display){alert('Fill in required fields');return}
  const data=new URLSearchParams()
  data.append('name',name)
  data.append('slug',slug)
  data.append('x_screen_name',x)
  data.append('admin_username',user)
  data.append('admin_password',pass)
  data.append('admin_display_name',display)
  const resp=await api('/panel/api/admin/tenants',{method:'POST',body:data,headers:{'Content-Type':'application/x-www-form-urlencoded'}})
  if(resp&&resp.id){div.remove();loadTenants();loadStats()}
}

function esc(s){if(!s)return '';var d=document.createElement('div');d.textContent=s;return d.innerHTML}

async function init(){
  const t=getToken()
  if(!t){window.location.href='/admin-login';return}
  const me=await api('/panel/api/admin/me')
  if(!me){window.location.href='/admin-login';return}
  document.getElementById('dashboardArea').classList.remove('hidden')
  await loadStats()
  await loadTenants()
}
init()
</script>
</body>
</html>
