<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta property="og:title" content="Root Admin — Unsr!fess">
<meta property="og:description" content="Root administration panel">
<meta name="theme-color" content="#0e0e12">
<title>Root Admin — Unsr!fess</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0e0e12;color:#e7e9ea;min-height:100vh;padding:20px}
.container{max-width:1200px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid #2a2a38}
h1{font-size:1.5rem}
h2{font-size:1.2rem;margin-bottom:12px}
.logout-btn{padding:8px 20px;background:transparent;border:1px solid #2a2a38;border-radius:9999px;color:#e7e9ea;cursor:pointer;transition:border-color .2s}
.logout-btn:hover{border-color:#f4212e;color:#f4212e}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:#1a1a24;border:1px solid #2a2a38;border-radius:12px;padding:16px;text-align:center}
.stat-card .num{font-size:1.8rem;font-weight:700;color:#1d9bf0}
.stat-card .label{font-size:.8rem;color:#71767b;margin-top:4px;text-transform:capitalize}
.tenants-table{background:#1a1a24;border:1px solid #2a2a38;border-radius:12px;overflow-x:auto}
.tenants-table table{width:100%;border-collapse:collapse;min-width:700px}
.tenants-table th,.tenants-table td{padding:12px 16px;text-align:left;border-bottom:1px solid #2a2a38;font-size:.9rem}
.tenants-table th{background:#0e0e12;font-size:.78rem;color:#71767b;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.badge{display:inline-block;padding:3px 10px;border-radius:9999px;font-size:.75rem;font-weight:600}
.badge.active{background:rgba(0,186,124,0.12);color:#00ba7c;border:1px solid rgba(0,186,124,0.25)}
.badge.inactive{background:rgba(244,33,46,0.12);color:#f4212e;border:1px solid rgba(244,33,46,0.25)}
.actions{display:flex;gap:6px;flex-wrap:nowrap}
.actions button{padding:5px 14px;border-radius:6px;border:none;font-size:.8rem;cursor:pointer;font-weight:600;white-space:nowrap;transition:opacity .2s}
.actions button:hover{opacity:.8}
.btn-activate{background:#00ba7c;color:#fff}
.btn-deactivate{background:#f4212e;color:#fff}
.btn-login-as{background:#1d9bf0;color:#fff}
.btn-create{background:#1d9bf0;color:#fff;padding:10px 24px;border:none;border-radius:9999px;font-size:.9rem;font-weight:600;cursor:pointer;margin-bottom:16px;transition:opacity .2s}
.btn-create:hover{opacity:.8}

.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="dashboardArea">
  <div class="container">
    <div class="header">
      <h1>Root Dashboard</h1>
      <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>
    <div class="stats-grid" id="statsGrid"></div>
    <button class="btn-create" onclick="showCreateTenant()">+ Create Tenant</button>
    <div class="tenants-table">
      <table>
        <thead><tr><th>ID</th><th>Name</th><th>Slug</th><th>X Handle</th><th>Status</th><th>Tweets</th><th>Admins</th><th>Created</th><th>Actions</th></tr></thead>
        <tbody id="tenantsBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
function getToken(){return localStorage.getItem('admin_token')}

async function api(url,opts={}){
  const t=getToken()
  if(!t){window.location.href='/admin-login';return}
  opts.headers=opts.headers||{}
  opts.headers['Authorization']='Bearer '+t
  try{
    const resp=await fetch(url,opts)
    if(resp.status===401){localStorage.removeItem('admin_token');window.location.href='/admin-login';return null}
    return await resp.json()
  }catch(e){return null}
}

function logout(){localStorage.removeItem('admin_token');localStorage.removeItem('admin_role');window.location.href='/admin-login'}

async function loadStats(){
  const stats=await api('/panel/api/admin/stats')
  if(!stats)return
  document.getElementById('statsGrid').innerHTML=Object.entries(stats).map(([k,v])=>
    '<div class="stat-card"><div class="num">'+v+'</div><div class="label">'+k.replace(/_/g,' ')+'</div></div>'
  ).join('')
}

async function loadTenants(){
  const tenants=await api('/panel/api/admin/tenants')
  if(!tenants||!tenants.length){document.getElementById('tenantsBody').innerHTML='<tr><td colspan="9" style="text-align:center;color:#71767b;padding:32px">No tenants yet</td></tr>';return}
  document.getElementById('tenantsBody').innerHTML=tenants.map(t=>{
    const badge=t.is_active?'<span class="badge active">Active</span>':'<span class="badge inactive">Inactive</span>'
    const created=t.created_at?new Date(t.created_at).toLocaleDateString():'-'
    const xHandle=t.x_screen_name?'@'+t.x_screen_name:'-'
    return '<tr><td>'+t.id+'</td><td>'+esc(t.name)+'</td><td>'+esc(t.slug)+'</td><td>'+esc(xHandle)+'</td><td>'+badge+'</td><td>'+(t.total_tweets||0)+'</td><td>'+(t.total_admins||0)+'</td><td>'+created+'</td><td class="actions">'+
      (t.is_active?'<button class="btn-deactivate" onclick="toggleTenant('+t.id+',false)">Deactivate</button>':'<button class="btn-activate" onclick="toggleTenant('+t.id+',true)">Activate</button>')+
      '<button class="btn-login-as" onclick="loginAs('+t.id+')">Login As</button></td></tr>'
  }).join('')
}

async function toggleTenant(id,activate){
  await api('/panel/api/admin/tenants/'+id+'/'+(activate?'activate':'deactivate'),{method:'POST'})
  loadTenants()
}

async function loginAs(id){
  const data=await api('/panel/api/admin/tenants/'+id+'/login-as',{method:'POST'})
  if(data&&data.token){
    localStorage.setItem('admin_token',data.token)
    window.location.href='/'+data.slug+'/panel/dashboard'
  }
}

function showCreateTenant(){
  const div=document.createElement('div')
  div.style.cssText='position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;padding:20px'
  div.innerHTML='<div style="background:#1a1a24;border:1px solid #2a2a38;border-radius:16px;padding:28px;max-width:460px;width:100%;max-height:90vh;overflow-y:auto">'+
    '<h2 style="font-size:1.1rem;margin-bottom:16px">Create Tenant</h2>'+
    '<input id="ctName" placeholder="Service Name" style="width:100%;padding:10px;margin-bottom:10px;background:#0e0e12;border:1px solid #2a2a38;border-radius:8px;color:#e7e9ea;display:block">'+
    '<input id="ctSlug" placeholder="Slug (e.g. my-conf)" style="width:100%;padding:10px;margin-bottom:10px;background:#0e0e12;border:1px solid #2a2a38;border-radius:8px;color:#e7e9ea;display:block">'+
    '<input id="ctX" placeholder="X Handle (optional)" style="width:100%;padding:10px;margin-bottom:10px;background:#0e0e12;border:1px solid #2a2a38;border-radius:8px;color:#e7e9ea;display:block">'+
    '<input id="ctUser" placeholder="Admin Username" style="width:100%;padding:10px;margin-bottom:10px;background:#0e0e12;border:1px solid #2a2a38;border-radius:8px;color:#e7e9ea;display:block">'+
    '<input id="ctPass" type="password" placeholder="Admin Password" style="width:100%;padding:10px;margin-bottom:10px;background:#0e0e12;border:1px solid #2a2a38;border-radius:8px;color:#e7e9ea;display:block">'+
    '<input id="ctDisplay" placeholder="Admin Display Name" style="width:100%;padding:10px;margin-bottom:14px;background:#0e0e12;border:1px solid #2a2a38;border-radius:8px;color:#e7e9ea;display:block">'+
    '<div style="display:flex;gap:8px"><button onclick="this.closest(\'div[style]\').remove()" style="flex:1;padding:10px;border-radius:9999px;border:1px solid #2a2a38;background:transparent;color:#e7e9ea;cursor:pointer;font-size:.9rem">Cancel</button>'+
    '<button onclick="createTenant(this)" style="flex:1;padding:10px;border-radius:9999px;border:none;background:#1d9bf0;color:#fff;cursor:pointer;font-size:.9rem;font-weight:600">Create</button></div></div>'
  document.body.appendChild(div)
}

async function createTenant(btn){
  const div=btn.closest('div[style]')
  const name=div.querySelector('#ctName').value.trim()
  const slug=div.querySelector('#ctSlug').value.trim()
  const x=div.querySelector('#ctX').value.trim()
  const user=div.querySelector('#ctUser').value.trim()
  const pass=div.querySelector('#ctPass').value
  const display=div.querySelector('#ctDisplay').value.trim()
  if(!name||!slug||!user||!pass||!display){alert('Fill in required fields');return}
  const data=new URLSearchParams()
  data.append('name',name)
  data.append('slug',slug)
  data.append('x_screen_name',x)
  data.append('admin_username',user)
  data.append('admin_password',pass)
  data.append('admin_display_name',display)
  const resp=await api('/panel/api/admin/tenants',{method:'POST',body:data,headers:{'Content-Type':'application/x-www-form-urlencoded'}})
  if(resp&&resp.id){div.remove();loadTenants();loadStats()}
}

function esc(s){if(!s)return '';var d=document.createElement('div');d.textContent=s;return d.innerHTML}

async function init(){
  const t=getToken()
  if(!t){window.location.href='/admin-login';return}
  const me=await api('/panel/api/admin/me')
  if(!me){window.location.href='/admin-login';return}
  document.getElementById('dashboardArea').classList.remove('hidden')
  await loadStats()
  await loadTenants()
}
init()
</script>
</body>
</html>
