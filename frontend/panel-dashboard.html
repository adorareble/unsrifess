<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Dashboard — Unsr!fess</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0e0e12; color: #e7e9ea; font-size: 14px;
  }

  /* ── Topbar ── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px; border-bottom: 1px solid #2a2a38;
    background: #0a0a0e; position: sticky; top: 0; z-index: 50;
  }
  .topbar h1 {
    font-size: 0.9rem; font-weight: 700;
    background: linear-gradient(135deg, #1d9bf0, #8b5cf6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .topbar h1 span { -webkit-text-fill-color: #71767b; font-weight: 400; }
  .topbar-right { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; }
  .topbar-right .admin-name { color: #1d9bf0; }
  .topbar-right .role-badge {
    font-size: 0.65rem; padding: 1px 6px; border-radius: 10px;
    background: rgba(29,155,240,0.12); color: #1d9bf0; text-transform: uppercase;
  }
  .topbar-right .role-badge.super { background: rgba(244,196,48,0.12); color: #f4c430; }
  .logout-btn {
    background: transparent; border: 1px solid #2a2a38; color: #e7e9ea;
    padding: 4px 10px; border-radius: 10px; cursor: pointer; font-size: 0.75rem;
  }
  .logout-btn:hover { border-color: #f4212e; color: #f4212e; }

  .container { max-width: 1200px; margin: 0 auto; padding: 12px 16px; }

  /* ── Stats ── */
  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 6px; margin-bottom: 10px;
  }
  .stat-card {
    background: #1a1a24; border: 1px solid #2a2a38; border-radius: 8px;
    padding: 8px 6px; text-align: center;
  }
  .stat-card .num { font-size: 1rem; font-weight: 700; }
  .stat-card .label { font-size: 0.65rem; color: #71767b; margin-top: 2px; }
  .stat-card .num.pending { color: #f4c430; }
  .stat-card .num.approved { color: #00ba7c; }
  .stat-card .num.rejected { color: #f4212e; }
  .stat-card .num.total { color: #1d9bf0; }
  .stat-card .num.online { color: #00ba7c; }
  .stat-card .num.offline { color: #f4212e; }
  .stat-card.clickable { cursor: pointer; }
  .stat-card.clickable:hover { background: #22222e; }
  .badge-on, .badge-off { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; }
  .badge-on { background: rgba(0,186,124,0.12); color: #00ba7c; }
  .badge-off { background: rgba(244,33,46,0.12); color: #f4212e; }

  /* ── Tabs ── */
  .tabs { display: flex; gap: 0; margin-bottom: 12px; border-bottom: 1px solid #2a2a38; overflow-x: auto; }
  .tab {
    padding: 8px 14px; cursor: pointer; font-size: 0.8rem; font-weight: 500;
    color: #71767b; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab:hover { color: #e7e9ea; background: rgba(239,243,244,0.02); }
  .tab.active { color: #1d9bf0; border-bottom-color: #1d9bf0; }
  .tab .badge {
    display: inline-block; margin-left: 4px; font-size: 0.65rem;
    padding: 0 5px; border-radius: 10px; background: #1d9bf0; color: #fff;
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .stab-content { display: block; }
  .stab-content.hidden { display: none; }

  /* ── Queue Card ── */
  .queue-card {
    background: #1a1a24; border: 1px solid #2a2a38; border-radius: 12px;
    padding: 14px; margin-bottom: 8px;
  }
  .queue-card .meta { font-size: 0.7rem; color: #71767b; }
  .queue-card .text {
    font-size: 0.85rem; line-height: 1.5; margin-bottom: 10px;
    white-space: pre-wrap; word-break: break-word;
  }
  .queue-card .actions { display: flex; gap: 6px; margin-bottom: 10px; }
  .queue-card .actions .btn {
    padding: 6px 14px; border: none; border-radius: 10px;
    font-size: 0.8rem; font-weight: 600; cursor: pointer;
  }
  .btn-approve { background: #00ba7c; color: #fff; }
  .btn-approve:hover { background: #009d68; }
  .btn-approve:disabled { background: #005f3f; color: #888; cursor: not-allowed; }
  .btn-reject { background: #f4212e; color: #fff; }
  .btn-reject:hover { background: #c8102e; }

  .empty-state { text-align: center; padding: 40px 16px; color: #71767b; font-size: 0.85rem; }

  /* ── Thumbnails ── */
  .thumb-grid {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px;
  }
  .thumb {
    width: 80px; height: 80px; border-radius: 8px; overflow: hidden;
    border: 1px solid #2a2a38; cursor: pointer; flex-shrink: 0;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb:hover { border-color: #1d9bf0; }

  /* ── Lightbox ── */
  .lightbox {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.85); display: flex;
    align-items: center; justify-content: center; padding: 20px;
  }
  .lightbox.hidden { display: none; }
  .lightbox .close {
    position: absolute; top: 16px; right: 16px;
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,0.1); border: none;
    color: #fff; font-size: 1.2rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .lightbox .close:hover { background: rgba(255,255,255,0.2); }
  .lightbox .nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.1); border: none;
    color: #fff; font-size: 1.3rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .lightbox .nav:hover { background: rgba(255,255,255,0.2); }
  .lightbox .nav.prev { left: 16px; }
  .lightbox .nav.next { right: 16px; }
  .lightbox img {
    max-width: 90%; max-height: 90%; border-radius: 8px;
    object-fit: contain;
  }

  /* ── Popup ── */
  .popup-overlay {
    position: fixed; inset: 0; z-index: 150;
    background: rgba(0,0,0,0.7); display: flex;
    align-items: center; justify-content: center; padding: 20px;
  }
  .popup-overlay.hidden { display: none; }
  .popup-card {
    background: #1a1a24; border: 1px solid #2a2a38; border-radius: 16px;
    padding: 24px; max-width: 380px; width: 100%; text-align: center;
  }
  .popup-card.large {
    max-width: min(90vw, 800px);
    text-align: left;
  }
  .popup-icon { font-size: 1.8rem; margin-bottom: 10px; }
  .popup-title { font-size: 1rem; font-weight: 600; margin-bottom: 8px; }
  .popup-msg { font-size: 0.85rem; color: #71767b; margin-bottom: 16px; line-height: 1.5; }
  .popup-actions { display: flex; gap: 8px; justify-content: center; }
  .popup-btn {
    padding: 8px 20px; border: none; border-radius: 10px;
    font-size: 0.85rem; font-weight: 600; cursor: pointer; color: #fff;
  }
  .popup-btn-primary { background: #1d9bf0; }
  .popup-btn-danger { background: #f4212e; }
  .popup-btn-ghost { background: #2a2a38; color: #e7e9ea; }

  /* ── Filter bar ── */
  .filter-bar {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: center;
  }
  .filter-bar select, .filter-bar input {
    background: #1a1a24; border: 1px solid #2a2a38; border-radius: 8px;
    color: #e7e9ea; padding: 6px 10px; font-size: 0.8rem; outline: none; font-family: inherit;
  }
  .filter-bar select:focus, .filter-bar input:focus { border-color: #1d9bf0; }

  /* ── Table ── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #2a2a38; }
  th { color: #71767b; font-weight: 500; }
  td { color: #e7e9ea; }
  .status-badge {
    display: inline-block; padding: 1px 8px; border-radius: 10px;
    font-size: 0.7rem; font-weight: 600;
  }
  .status-pending { background: rgba(244,196,48,0.12); color: #f4c430; }
  .status-approved { background: rgba(0,186,124,0.12); color: #00ba7c; }
  .status-rejected { background: rgba(244,33,46,0.12); color: #f4212e; }
  .status-deleted { background: rgba(113,118,123,0.12); color: #71767b; }
  .text-preview { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .text-preview:hover { color: #1d9bf0; }
  .img-badge { margin-left: 6px; font-size: 0.75rem; opacity: 0.7; }
  table tbody tr { height: 48px; }

  /* ── Keyword tags ── */
  .keyword-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .keyword-tag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 10px; font-size: 0.8rem;
    background: rgba(29,155,240,0.08); border: 1px solid rgba(29,155,240,0.2);
  }
  .keyword-tag .del {
    cursor: pointer; color: #f4212e; font-weight: 700; font-size: 0.85rem; line-height: 1;
  }
  .keyword-tag .del:hover { color: #c8102e; }
  .add-keyword-form { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

  /* ── Pagination ── */
  .pagination {
    display: flex; gap: 6px; justify-content: center; margin-top: 12px; align-items: center;
  }
  .pagination button {
    background: #1a1a24; border: 1px solid #2a2a38; border-radius: 8px;
    color: #e7e9ea; padding: 4px 12px; cursor: pointer; font-size: 0.8rem;
  }
  .pagination button:hover { border-color: #1d9bf0; }
  .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
  .pagination .page-info { color: #71767b; font-size: 0.8rem; }

  .btn-small {
    padding: 3px 10px; border: none; border-radius: 8px;
    font-size: 0.72rem; font-weight: 600; cursor: pointer; color: #fff;
  }
  .btn-small.danger { background: #f4212e; }
  .btn-small.danger:hover { background: #c8102e; }
  .btn-small.primary { background: #1d9bf0; }
  .btn-small.primary:hover { background: #1a8cd8; }

  .msg { font-size: 0.8rem; min-height: 1.2em; margin-top: 6px; }
  .msg.ok { color: #00ba7c; }
  .msg.err { color: #f4212e; }

  /* ── Peak Hours Heatmap ── */
  .heatmap-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .heatmap {
    display: grid;
    grid-template-columns: 70px repeat(24, minmax(28px, 1fr));
    gap: 2px; font-size: 0.7rem; min-width: 740px;
  }
  .heatmap .cell { padding: 4px 2px; text-align: center; border-radius: 3px; }
  .heatmap .label { color: #71767b; text-align: right; padding-right: 6px; }
  .heatmap .header { color: #71767b; font-weight: 500; }

  @media (max-width: 768px) {
    .container { padding: 8px 10px; }
    .topbar { padding: 6px 10px; }
    .tab { padding: 6px 10px; font-size: 0.75rem; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .thumb { width: 64px; height: 64px; }
    table { font-size: 0.7rem; }
    th, td { padding: 4px 6px; }
    .heatmap { grid-template-columns: 50px repeat(24, minmax(18px, 1fr)); min-width: 0; gap: 1px; font-size: 0.6rem; }
    .heatmap .cell { padding: 4px 1px; }
    .heatmap .label { padding-right: 4px; font-size: 0.55rem; }
    .heatmap .header { font-size: 0.55rem; }
  }
</style>
</head>
<body>
<div class="topbar">
  <h1>Unsr!fess <span>Panel</span></h1>
  <div class="topbar-right">
    <span class="admin-name" id="adminName"></span>
    <span class="role-badge" id="roleBadge"></span>
    <button class="logout-btn" onclick="logout()">Log out</button>
  </div>
</div>

<div class="container">
  <div class="stats" id="statsRow"></div>

  <div id="peakHoursRow" style="margin-bottom:10px"></div>

  <div class="tabs" id="tabBar">
    <div class="tab active" data-tab="queue" onclick="switchTab('queue')">Queue <span class="badge" id="queueBadge">0</span></div>
    <div class="tab" data-tab="history" onclick="switchTab('history')">History</div>
    <div class="tab" data-tab="users" onclick="switchTab('users')">Users</div>
    <div class="tab" data-tab="settings" onclick="switchTab('settings')">Settings</div>
  </div>

  <div id="tabQueue" class="tab-content active"></div>
  <div id="tabHistory" class="tab-content"></div>
  <div id="tabUsers" class="tab-content"></div>
  <div id="tabSettings" class="tab-content"></div>
</div>

<!-- Lightbox -->
<div class="lightbox hidden" id="lightbox">
  <button class="close" onclick="closeLightbox()">&times;</button>
  <button class="nav prev" id="lbPrev" onclick="lbNav(-1)">&#8249;</button>
  <button class="nav next" id="lbNext" onclick="lbNav(1)">&#8250;</button>
  <img id="lbImg" src="" alt="preview">
</div>

<!-- Popup -->
<div class="popup-overlay hidden" id="popupOverlay" onclick="if(event.target===this)closePopup()">
  <div class="popup-card" onclick="event.stopPropagation()">
    <div class="popup-icon" id="popupIcon"></div>
    <div class="popup-title" id="popupTitle"></div>
    <div class="popup-msg" id="popupMsg"></div>
    <div class="popup-actions" id="popupActions"></div>
  </div>
</div>

<script>
const TOKEN = localStorage.getItem('panel_token');
const ADMIN = JSON.parse(localStorage.getItem('panel_admin') || '{}');
let userIdFromPopup = 0;
let userTweetsPages = {};

if (!TOKEN) { window.location.href = '/panel/login'; }

const headers = { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/x-www-form-urlencoded' };
const api = (path, opts = {}) =>
  fetch(path, { ...opts, headers: { ...headers, ...opts.headers } }).then(r => {
    if (r.status === 401) { logout(); throw new Error('Unauthorized'); }
    return r;
  });

document.getElementById('adminName').textContent = ADMIN.display_name || ADMIN.username;
const badge = document.getElementById('roleBadge');
badge.textContent = ADMIN.role || 'admin';
if (ADMIN.role === 'superadmin') badge.classList.add('super');

function logout() {
  localStorage.removeItem('panel_token');
  localStorage.removeItem('panel_admin');
  window.location.href = '/panel/login';
}

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtTime(dateStr) {
  const d = new Date(dateStr + (dateStr.endsWith('Z') ? '' : 'Z'));
  const pad = n => String(n).padStart(2, '0');
  return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear()
    + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}
function showFullFromAttr(el) {
  const imgs = el.dataset.images;
  let imgsHtml = '';
  if (imgs) {
    const fns = JSON.parse(imgs);
    if (fns.length) {
      imgsHtml = '<div class="thumb-grid" style="margin-bottom:12px">';
      fns.forEach((fn, i) => {
        imgsHtml += '<div class="thumb" onclick=\'openLightbox(' + JSON.stringify(fns) + ',' + i + ')\'><img src="/panel/api/images/' + fn + '?token=' + TOKEN + '"></div>';
      });
      imgsHtml += '</div>';
    }
  }
  const textHtml = '<div style="white-space:pre-wrap;word-break:break-word;max-height:300px;overflow-y:auto">' + escHtml(el.dataset.full) + '</div>';
  showPopup('', '', imgsHtml + textHtml, [{text:'Close',cls:'popup-btn-ghost',fn:closePopup}]);
}
function escHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ── Popup ──
function showPopup(icon, title, msg, buttons, large) {
  const card = document.querySelector('.popup-card');
  card.classList.toggle('large', !!large);
  const iconEl = document.getElementById('popupIcon');
  iconEl.textContent = icon;
  iconEl.style.display = icon ? '' : 'none';
  const titleEl = document.getElementById('popupTitle');
  titleEl.textContent = title;
  titleEl.style.display = title ? '' : 'none';
  document.getElementById('popupMsg').innerHTML = msg;
  const actions = document.getElementById('popupActions');
  actions.innerHTML = '';
  (buttons || [{ text: 'OK', cls: 'popup-btn-primary', fn: closePopup }]).forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'popup-btn ' + (b.cls || 'popup-btn-primary');
    btn.textContent = b.text;
    btn.onclick = b.fn;
    actions.appendChild(btn);
  });
  document.getElementById('popupOverlay').classList.remove('hidden');
}
function closePopup() {
  document.getElementById('popupOverlay').classList.add('hidden');
}

// ── Lightbox ──
let lbImages = [];
let lbIndex = 0;

function openLightbox(images, idx) {
  lbImages = images;
  lbIndex = idx;
  showLbImage();
  document.getElementById('lightbox').classList.remove('hidden');
  document.getElementById('lbPrev').classList.toggle('hidden', images.length <= 1);
  document.getElementById('lbNext').classList.toggle('hidden', images.length <= 1);
}
function closeLightbox() {
  document.getElementById('lightbox').classList.add('hidden');
}
function lbNav(dir) {
  lbIndex = (lbIndex + dir + lbImages.length) % lbImages.length;
  showLbImage();
}
function showLbImage() {
  document.getElementById('lbImg').src = '/panel/api/images/' + lbImages[lbIndex] + '?token=' + TOKEN;
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft' && !document.getElementById('lightbox').classList.contains('hidden')) lbNav(-1);
  if (e.key === 'ArrowRight' && !document.getElementById('lightbox').classList.contains('hidden')) lbNav(1);
});

// ─── Stats ──────────────────────────────────────────────
async function loadStats() {
  try {
    const r = await api('/panel/api/stats');
    const d = await r.json();
    document.getElementById('statsRow').innerHTML = `
      <div class="stat-card"><div class="num pending">${d.pending_count}</div><div class="label">Pending</div></div>
      <div class="stat-card"><div class="num approved">${d.approved_today}</div><div class="label">Approved Today</div></div>
      <div class="stat-card"><div class="num rejected">${d.rejected_today}</div><div class="label">Rejected Today</div></div>

      <div class="stat-card"><div class="num total">${d.total_tweets}</div><div class="label">Total Tweets</div></div>
    `;
    document.getElementById('queueBadge').textContent = d.pending_count;

    // Update Settings tab toggles if present
    const statusEl = document.getElementById('settingsOnline');
    if (statusEl) {
      statusEl.innerHTML = d.online ? 'Online' : 'Offline';
      statusEl.className = 'num ' + (d.online ? 'online' : 'offline');
    }
    const bypassEl = document.getElementById('settingsBypass');
    if (bypassEl) {
      bypassEl.innerHTML = d.bypass ? 'Bypass ON' : 'Bypass OFF';
      bypassEl.className = 'num ' + (d.bypass ? 'online' : 'offline');
    }
    const bypassMutualEl = document.getElementById('settingsBypassMutual');
    if (bypassMutualEl) {
      bypassMutualEl.innerHTML = d.bypass_mutual ? 'BM ON' : 'BM OFF';
      bypassMutualEl.className = 'num ' + (d.bypass_mutual ? 'online' : 'offline');
    }
  } catch(_) {}

  // Peak hours heatmap
  try {
    const ar = await api('/panel/api/stats/peak-hours');
    const adata = await ar.json();
    const el = document.getElementById('peakHoursRow');
    if (adata && adata.length) {
      const maxCount = Math.max(...adata.map(d => d.count), 1);
      const grid = {};
      for (const d of adata) { grid[d.day + '-' + d.hour] = d.count; }
      const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      let html = '<div style="margin-bottom:6px"><h3 style="font-size:0.85rem;font-weight:600">Peak Hours <span style="color:#71767b;font-weight:400;font-size:0.7rem">(last 30 days)</span></h3></div>';
      html += '<div class="heatmap-wrap" style="cursor:grab" ontouchstart=""><div class="heatmap">';
      html += '<div class="cell header label"></div>';
      for (let h = 0; h < 24; h++) html += '<div class="cell header">' + h + '</div>';
      for (let d = 0; d < 7; d++) {
        html += '<div class="cell label">' + DAY_NAMES[d] + '</div>';
        for (let h = 0; h < 24; h++) {
          const count = grid[d + '-' + h] || 0;
          const intensity = count / maxCount;
          const r = Math.round(13 + intensity * 26);
          const g = Math.round(30 + intensity * 156);
          const b = Math.round(58 + intensity * 240);
          html += '<div class="cell" style="background:rgba(' + r + ',' + g + ',' + b + ',' + (0.3 + intensity * 0.7) + ')">' + (count > 0 ? count : '') + '</div>';
        }
      }
      html += '</div></div>';
      el.innerHTML = html;
    } else {
      el.innerHTML = '';
    }
  } catch(_) { document.getElementById('peakHoursRow').innerHTML = ''; }
}

async function toggleOnline() {
  const num = document.getElementById('settingsOnline');
  const isOnline = (num.textContent || '').trim() === 'Online';
  const newState = !isOnline;
  num.textContent = newState ? 'Online' : 'Offline';
  num.className = 'num ' + (newState ? 'online' : 'offline');
  try { await api('/panel/api/set-online', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: newState ? 'value=1' : 'value=0' }); } catch(_) {}
  loadStats();
}

async function toggleBypass() {
  const num = document.getElementById('settingsBypass');
  const isOn = (num.textContent || '').trim() === 'Bypass ON';
  const newState = !isOn;
  num.textContent = newState ? 'Bypass ON' : 'Bypass OFF';
  num.className = 'num ' + (newState ? 'online' : 'offline');

// ─── Queue Tab ──────────────────────────────────────────
let queuePage = 1;

function imagesFromTweet(t) {
  if (!t.image_paths) return [];
  try { return JSON.parse(t.image_paths); } catch { return []; }
}
function filenameFromPath(p) {
  return p.split(/[/\\]/).pop();
}

async function loadQueue() {
  const el = document.getElementById('tabQueue');
  try {
    const r = await api('/panel/api/tweets/pending?page=' + queuePage + '&limit=10');
    const d = await r.json();
    const tweets = d.tweets || [];
    document.getElementById('queueBadge').textContent = d.total || tweets.length;

    if (tweets.length === 0) {
      el.innerHTML = '<div class="empty-state">No pending tweets</div>';
      return;
    }

    let html = '';
    for (const t of tweets) {
      const images = imagesFromTweet(t);
      let thumbsHtml = '';
      if (images.length) {
        thumbsHtml = '<div class="thumb-grid">';
        images.forEach((fp, idx) => {
          const fn = filenameFromPath(fp);
          thumbsHtml += '<div class="thumb" onclick=\'openLightbox(' + JSON.stringify(images.map(filenameFromPath)) + ',' + idx + ')\'><img src="/panel/api/images/' + fn + '?token=' + TOKEN + '"></div>';
        });
        thumbsHtml += '</div>';
      }

      let metaParts = ['#' + t.id, fmtTime(t.submitted_at)];
      if (t.chunk_count > 1) metaParts.push(t.chunk_count + ' tweets');
      if (t.user_screen_name) metaParts.push('@' + t.user_screen_name);

      const userInfo = t.user_screen_name
        ? '<div style="display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:0.8rem">'
          + '<div style="width:28px;height:28px;border-radius:50%;overflow:hidden;background:#2a2a38;flex-shrink:0">'
          + (t.user_avatar_url ? '<img src="' + t.user_avatar_url + '" style="width:100%;height:100%;object-fit:cover">' : '')
          + '</div>'
          + '<span style="color:#1d9bf0;cursor:pointer;font-weight:500" onclick="showUserTweets(' + t.x_user_db_id + ')">@' + escHtml(t.user_screen_name) + '</span>'
          + '</div>'
        : '';

      html += '<div class="queue-card" id="qt-' + t.id + '">'
        + userInfo
        + thumbsHtml
        + '<div class="text">' + escHtml(t.original_text) + '</div>'
        + '<div class="actions" id="qa-' + t.id + '">'
        + '<button class="btn btn-approve" onclick="approveTweet(' + t.id + ')">Approve</button>'
        + '<button class="btn btn-reject" onclick="rejectTweetPopup(' + t.id + ')">Reject</button>'
        + '</div>'
        + '<div class="meta">' + metaParts.join(' &middot; ') + '</div></div>';
    }

    const totalPages = Math.ceil((d.total || tweets.length) / 10);
    html += '<div class="pagination">'
      + '<button onclick="queuePage--;loadQueue()"' + (queuePage <= 1 ? ' disabled' : '') + '>Prev</button>'
      + '<span class="page-info">Page ' + queuePage + ' of ' + totalPages + '</span>'
      + '<button onclick="queuePage++;loadQueue()"' + (queuePage >= totalPages ? ' disabled' : '') + '>Next</button>'
      + '</div>';

    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = '<div class="empty-state" style="color:#f4212e">Failed to load queue</div>';
  }
}

async function approveTweet(id) {
  const btn = document.querySelector('#qa-' + id + ' .btn-approve');
  if (btn) { btn.disabled = true; btn.textContent = 'Approving...'; }
  try {
    const r = await api('/panel/api/tweets/' + id + '/approve', { method: 'POST' });
    const d = await r.json();
    if (d.success) {
      const card = document.getElementById('qt-' + id);
      if (card) card.style.display = 'none';
      loadStats();
    } else {
      if (btn) { btn.disabled = false; btn.textContent = 'Approve'; }
      showPopup('⚠️', 'Approve Failed', d.error || 'Could not approve tweet.', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]);
    }
  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Approve'; }
    showPopup('⚠️', 'Error', 'Connection error.', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]);
  }
}

    }

            : '-') + '</td>'

        + '<td>' + (t.reject_reason ? escHtml(t.reject_reason) : '-') + '</td>'

async function showUserTweets(userId) {

    html += '<div style="margin-bottom:10px;font-size:0.85rem">Tweets by <a href="https://x.com/' + encodeURIComponent(d.screen_name) + '" target="_blank" style="color:#1d9bf0">@' + d.screen_name + '</a></div>';
    if (tweets.length === 0) {
      html += '<div class="empty-state">No tweets from this user</div>';
    } else {
      html += '<table style="font-size:0.75rem;width:100%"><thead><tr>'
        + '<th style="padding:6px 8px">#</th><th style="padding:6px 8px">Status</th><th style="padding:6px 8px">Text</th><th style="padding:6px 8px">Date</th><th style="padding:6px 8px">Reviewer</th><th style="padding:6px 8px">Reason</th><th style="padding:6px 8px">URL</th><th style="padding:6px 8px">Action</th>'

        const linkHtml = urls.length ? '<a href="' + urls[0] + '" target="_blank" style="color:#1d9bf0">link</a>' : '';
        let actHtml = '';
        if (t.status === 'pending') {
          actHtml = '<button class="btn-small primary" onclick="doApproval(' + t.id + ',\'' + d.screen_name + '\')" style="margin-right:4px">Approve</button>'
            + '<button class="btn-small danger" onclick="doRejection(' + t.id + ',\'' + d.screen_name + '\')">Reject</button>';
        } else if (t.status === 'approved') {
          if (ADMIN.role === 'superadmin') {
            actHtml = '<button class="btn-small danger" onclick="deleteTweetFromPopup(' + t.id + ')">Delete</button>';
          }
        }
        html += '<tr>'
          + '<td style="padding:6px 8px">' + t.id + '</td>'
          + '<td style="padding:6px 8px"><span class="status-badge status-' + t.status + '">' + t.status + '</span></td>'
          + '<td style="padding:6px 8px;max-width:300px" title="' + escHtml(t.original_text).replace(/"/g, '&quot;') + '">' + escHtml(t.original_text) + '</td>'
          + '<td style="padding:6px 8px;white-space:nowrap">' + fmtTime(t.submitted_at) + '</td>'
          + '<td style="padding:6px 8px">' + (t.reviewer_name || '-') + '</td>'
          + '<td style="padding:6px 8px;max-width:120px;color:#71767b">' + (t.reject_reason ? escHtml(t.reject_reason) : '-') + '</td>'
          + '<td style="padding:6px 8px">' + linkHtml + '</td>'
          + '<td style="padding:6px 8px;white-space:nowrap">' + actHtml + '</td>'
          + '</tr>';
      }
      html += '</tbody></table>';
      html += '<div class="pagination">'
        + '<button onclick="userTweetsPages[' + userId + ']=' + (page - 1) + ';showUserTweets(' + userId + ')"' + (page <= 1 ? ' disabled' : '') + '>Prev</button>'
        + '<span class="page-info">Page ' + page + ' of ' + totalPages + '</span>'
        + '<button onclick="userTweetsPages[' + userId + ']=' + (page + 1) + ';showUserTweets(' + userId + ')"' + (page >= totalPages ? ' disabled' : '') + '>Next</button>'
        + '</div>';
    }
    html += '</div>';
    showPopup('', 'User Tweets', html, null, true);
  } catch(e) {
    showPopup('⚠️', 'Error', 'Failed to load user tweets');
  }
}

      + '<td style="padding:10px 8px"><span class="badge-off" id="settingsOnline">-</span></td>'
      + '<td style="padding:10px 8px"><button class="btn-small primary" onclick="toggleOnline()">Toggle</button></td></tr>'
      + '<tr><td style="padding:10px 8px">Auto-approve</td>'
      + '<td style="padding:10px 8px"><span class="badge-off" id="settingsBypass">-</span></td>'
      + '<td style="padding:10px 8px"><button class="btn-small primary" onclick="toggleBypass()">Toggle</button></td></tr>'
      + '<tr><td style="padding:10px 8px">Bypass Mutual</td>'
      + '<td style="padding:10px 8px"><span class="badge-off" id="settingsBypassMutual">-</span></td>'
      + '<td style="padding:10px 8px"><button class="btn-small primary" onclick="toggleBypassMutual()">Toggle</button></td></tr>'
      + '<tr><td style="padding:10px 8px">Delete Window</td>'
      + '<td style="padding:10px 8px"><div style="display:flex;gap:4px;align-items:center"><input id="dwInput" type="number" min="1" value="5" style="width:50px;background:#0e0e12;border:1px solid #2a2a38;border-radius:6px;color:#e7e9ea;padding:4px 6px;font-size:0.8rem;outline:none;text-align:center"><span style="font-size:0.75rem;color:#71767b">min</span></div></td>'
      + '<td style="padding:10px 8px"><button class="btn-small primary" onclick="setDeleteWindow()">Save</button><span id="dwMsg" style="margin-left:6px;font-size:0.75rem;color:#71767b"></span></td></tr>'
      + '</tbody></table></div>';
  }
  html += '<h3 style="margin:24px 0 16px;font-size:1rem;color:#e7e9ea">Keyword Filters</h3>'
    + '<div style="font-size:0.82rem;color:#71767b;margin-bottom:8px">Tweets containing any of these keywords will be automatically rejected.</div>'
    + '<div class="add-keyword-form" style="margin-bottom:10px">'
    + '<input id="kwInput" placeholder="keyword1, keyword2, ..." style="flex:1;background:#0e0e12;border:1px solid #2a2a38;border-radius:8px;color:#e7e9ea;padding:10px 12px;font-size:0.85rem;outline:none" onkeydown="if(event.key===\'Enter\')addKeyword()">'
    + '<button class="btn-small primary" onclick="addKeyword()" style="padding:10px 20px">Add</button>'
    + '</div><div class="msg" id="kwMsg"></div>'
    + '<div class="keyword-list" id="kwList"><div class="empty-state">Loading...</div></div>'
    + '</div>';
  html += '</div>';

  // ── Activity Log tab ──
  html += '<div id="stabActivity" class="stab-content hidden">'
    + '<div class="filter-bar" style="margin-bottom:8px">'
    + '<select id="af-action" onchange="stabActivityPage=1;loadSettingsActivity()">'
    + '<option value="">All actions</option>'
    + '<option value="approve">Approve</option><option value="reject">Reject</option>'
    + '<option value="delete">Delete</option><option value="login">Login</option>'
    + '<option value="create_admin">Create Admin</option>'
    + '<option value="deactivate_admin">Deactivate Admin</option>'
    + '<option value="activate_admin">Activate Admin</option>'
    + '<option value="add_keyword">Add Keyword</option>'
    + '<option value="remove_keyword">Remove Keyword</option>'
    + '<option value="follow_user">Follow User</option>'
    + '<option value="unfollow_user">Unfollow User</option>'
    + '<option value="sync_x_users">Sync All</option>'
    + '<option value="set_online">Set Online</option>'
    + '<option value="set_bypass">Set Bypass</option>'
    + '<option value="set_bypass_mutual">Set Bypass Mutual</option>'
    + '<option value="set_delete_window">Set Delete Window</option>'
    + '</select></div>'
    + '<div id="activityTableWrap"><div class="empty-state">Loading...</div></div>'
    + '<div class="pagination" id="activityPagination"></div>'
    + '</div>';

  html += '</div>';
  el.innerHTML = html;

  loadKeywordsSection();
  if (isSuper) loadAdminsSection();
  loadSettingsActivity();

  if (isSuper) {
    fetch('/panel/api/stats', { headers: { 'Authorization': 'Bearer ' + TOKEN } })
      .then(r => r.json())
      .then(d => {
        const se = document.getElementById('settingsOnline');
        if (se) { se.textContent = d.online ? 'Online' : 'Offline'; se.className = 'badge-' + (d.online ? 'on' : 'off'); }
        const sb = document.getElementById('settingsBypass');
        if (sb) { sb.textContent = d.bypass ? 'Bypass ON' : 'Bypass OFF'; sb.className = 'badge-' + (d.bypass ? 'on' : 'off'); }
        const sbm = document.getElementById('settingsBypassMutual');
        if (sbm) { sbm.textContent = d.bypass_mutual ? 'BM ON' : 'BM OFF'; sbm.className = 'badge-' + (d.bypass_mutual ? 'on' : 'off'); }
        const dw = document.getElementById('dwInput');
        if (dw) dw.value = d.delete_window || 5;
      }).catch(() => {});
  }
}

// ── Keywords helpers ──
async function loadKeywordsSection() {
  const el = document.getElementById('kwList');
  try {
    const r = await api('/panel/api/keywords');
    const keywords = await r.json();
    el.innerHTML = keywords.length
      ? keywords.map(k => '<span class="keyword-tag">' + escHtml(k.keyword) + '<span class="del" onclick="removeKeyword(' + k.id + ')">&times;</span></span>').join('')
      : '<div class="empty-state">No keyword filters</div>';
  } catch(e) {
    el.innerHTML = '<div class="empty-state" style="color:#f4212e">Failed to load</div>';
  }
}
async function addKeyword() {
  const input = document.getElementById('kwInput');
  const val = input.value.trim();
  if (!val) return;
  const msg = document.getElementById('kwMsg');
  try {
    const form = new URLSearchParams();
    form.append('keywords', val);
    const r = await api('/panel/api/keywords', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: form.toString() });
    const d = await r.json();
    if (d.success) {
      input.value = '';
      msg.className = 'msg ok'; msg.textContent = d.added.length + ' keyword(s) added';
      loadKeywordsSection();
    } else { msg.className = 'msg err'; msg.textContent = 'Failed'; }
  } catch(e) { msg.className = 'msg err'; msg.textContent = 'Connection error'; }
}
async function removeKeyword(id) {
  showPopup('', '', 'Remove this keyword filter?', [
    { text: 'Cancel', cls: 'popup-btn-ghost', fn: closePopup },
    { text: 'Remove', cls: 'popup-btn-danger', fn: async () => { closePopup(); try { await api('/panel/api/keywords/' + id, { method: 'DELETE' }); loadKeywordsSection(); } catch(_) {} } },
  ]);
}

// ── Admin helpers ──
async function loadAdminsSection() {
  const el = document.getElementById('adminsTableWrap');
  try {
    const r = await api('/panel/api/admins');
    const admins = await r.json();
    let rows = '';
    for (const a of admins) {
      const lastLogin = a.last_login ? fmtTime(a.last_login) : '-';
      rows += '<tr>'
        + '<td>' + a.id + '</td>'
        + '<td>' + escHtml(a.username) + '</td>'
        + '<td>' + escHtml(a.display_name) + '</td>'
        + '<td><span class="status-badge ' + (a.role === 'superadmin' ? 'status-approved' : 'status-pending') + '">' + a.role + '</span></td>'
        + '<td>' + (a.is_active ? '<span style="color:#00ba7c">Active</span>' : '<span style="color:#71767b">Inactive</span>') + '</td>'
        + '<td>' + fmtTime(a.created_at) + '</td>'
        + '<td>' + lastLogin + '</td>'
        + '<td>' + (a.id !== ADMIN.id
            ? (a.is_active
                ? '<button class="btn-small danger" onclick="deactivateAdmin(' + a.id + ')">Deactivate</button>'
                : '<button class="btn-small primary" onclick="activateAdmin(' + a.id + ')">Reactivate</button>')
            : '-')
        + '</td></tr>';
    }
    el.innerHTML = '<div class="table-wrap"><table style="font-size:0.8rem"><thead><tr><th>ID</th><th>Username</th><th>Display Name</th><th>Role</th><th>Status</th><th>Created</th><th>Last Login</th><th>Action</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  } catch(e) {
    el.innerHTML = '<div class="empty-state" style="color:#f4212e">Failed to load admins</div>';
  }
}
async function activateAdmin(id) {
  try { await api('/panel/api/admins/' + id + '/activate', { method: 'POST' }); loadAdminsSection(); } catch(_) { showPopup('⚠️', 'Error', 'Failed to reactivate admin', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]); }
}
async function deactivateAdmin(id) {
  showPopup('🔒', 'Deactivate Admin?', 'Deactivate admin #' + id + '?', [
    { text: 'Cancel', cls: 'popup-btn-ghost', fn: closePopup },
    { text: 'Deactivate', cls: 'popup-btn-danger', fn: async () => { closePopup(); try { await api('/panel/api/admins/' + id + '/deactivate', { method: 'POST' }); loadAdminsSection(); } catch(_) { showPopup('⚠️', 'Error', 'Failed to deactivate admin', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]); } } },
  ]);
}
async function createAdmin() {
  const username = document.getElementById('au').value.trim();
  const password = document.getElementById('ap').value;
  const displayName = document.getElementById('an').value.trim();
  const msg = document.getElementById('adminMsg');
  if (!username || !password || !displayName) { msg.className = 'msg err'; msg.textContent = 'All fields required'; return; }
  try {
    const form = new URLSearchParams();
    form.append('username', username);
    form.append('password', password);
    form.append('display_name', displayName);
    const r = await api('/panel/api/register', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: form.toString() });
    const d = await r.json();
    if (d.success) {
      document.getElementById('au').value = ''; document.getElementById('ap').value = ''; document.getElementById('an').value = '';
      msg.className = 'msg ok'; msg.textContent = 'Admin created'; loadAdminsSection();
    } else { msg.className = 'msg err'; msg.textContent = d.detail || 'Failed'; }
  } catch(e) { msg.className = 'msg err'; msg.textContent = 'Connection error'; }
}

// ── Settings helpers ──
async function changeDisplayName() {
  const name = document.getElementById('dnInput').value.trim();
  const msg = document.getElementById('dnMsg');
  if (!name) { msg.style.color = '#f4212e'; msg.textContent = 'Name cannot be empty'; return; }
  try {
    const form = new URLSearchParams();
    form.append('display_name', name);
    const r = await api('/panel/api/change-display-name', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: form.toString() });
    const d = await r.json();
    if (d.success) {
      ADMIN.display_name = d.display_name;
      localStorage.setItem('panel_admin', JSON.stringify(ADMIN));
      document.getElementById('adminName').textContent = d.display_name;
      msg.style.color = '#00ba7c'; msg.textContent = 'Display name updated';
    } else { msg.style.color = '#f4212e'; msg.textContent = d.detail || 'Failed'; }
  } catch(e) { msg.style.color = '#f4212e'; msg.textContent = 'Connection error'; }
}

async function changePassword() {
  const oldPw = document.getElementById('pwOld').value;
  const newPw = document.getElementById('pwNew').value;
  const msg = document.getElementById('pwMsg');
  if (!oldPw || !newPw) { msg.style.color = '#f4212e'; msg.textContent = 'Fill both fields'; return; }
  if (newPw.length < 6) { msg.style.color = '#f4212e'; msg.textContent = 'Min 6 characters'; return; }
  try {
    const form = new URLSearchParams();
    form.append('old_password', oldPw);
    form.append('new_password', newPw);
    const r = await api('/panel/api/change-password', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: form.toString() });
    const d = await r.json();
    if (d.success) {
      msg.style.color = '#00ba7c'; msg.textContent = 'Password changed';
      document.getElementById('pwOld').value = ''; document.getElementById('pwNew').value = '';
    } else { msg.style.color = '#f4212e'; msg.textContent = d.detail || 'Failed'; }
  } catch(e) { msg.style.color = '#f4212e'; msg.textContent = 'Connection error'; }
}

async function setDeleteWindow() {
  const input = document.getElementById('dwInput');
  const msg = document.getElementById('dwMsg');
  const val = parseInt(input.value);
  if (!val || val < 1) { msg.textContent = 'Min 1 minute'; msg.style.color = '#f4212e'; return; }
  try {
    const form = new URLSearchParams();
    form.append('value', val.toString());
    const r = await api('/panel/api/set-delete-window', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: form.toString() });
    const d = await r.json();
    if (d.success) {
      msg.textContent = 'Saved: ' + val + ' minutes';
      msg.style.color = '#00ba7c';
      loadStats();
    } else { msg.textContent = d.detail || 'Failed'; msg.style.color = '#f4212e'; }
  } catch(e) { msg.textContent = 'Connection error'; msg.style.color = '#f4212e'; }
}

// ── Activity helpers ──
async function loadSettingsActivity() {
  const el = document.getElementById('activityTableWrap');
  const pagination = document.getElementById('activityPagination');
  try {
    const params = new URLSearchParams();
    params.set('page', stabActivityPage);
    params.set('limit', '10');
    const actionFilter = document.getElementById('af-action');
    if (actionFilter && actionFilter.value) params.set('action', actionFilter.value);

    const r = await api('/panel/api/activity?' + params.toString());
    const d = await r.json();
    const activities = d.activities || [];

    if (activities.length === 0) {
      el.innerHTML = '<div class="empty-state">No activity found</div>';
      pagination.innerHTML = '';
      return;
    }

    let rows = '';
    for (const a of activities) {
      rows += '<tr>'
        + '<td>' + escHtml(a.admin_name || 'Admin #' + a.admin_id) + '</td>'
        + '<td><span class="status-badge status-pending">' + a.action + '</span></td>'
        + '<td>' + (a.target_type ? a.target_type + ' #' + a.target_id : '-') + '</td>'
        + '<td>' + (a.details ? escHtml(a.details) : '-') + '</td>'
        + '<td>' + fmtTime(a.created_at) + '</td></tr>';
    }
    const totalPages = Math.ceil(d.total / 10);
    el.innerHTML = '<div class="table-wrap"><table style="font-size:0.8rem"><thead><tr><th>Admin</th><th>Action</th><th>Target</th><th>Details</th><th>Time</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    pagination.innerHTML = '<button onclick="stabActivityPage--;loadSettingsActivity()"' + (stabActivityPage <= 1 ? ' disabled' : '') + '>Prev</button>'
      + '<span class="page-info">Page ' + stabActivityPage + ' of ' + totalPages + '</span>'
      + '<button onclick="stabActivityPage++;loadSettingsActivity()"' + (stabActivityPage >= totalPages ? ' disabled' : '') + '>Next</button>';
  } catch(e) {
    el.innerHTML = '<div class="empty-state" style="color:#f4212e">Failed to load activity</div>';
    pagination.innerHTML = '';
  }
}

// ── Users helpers ──
let usersPage = 1;
let usersSearch = '';

async function loadUsers() {
  const el = document.getElementById('tabUsers');
  try {
    const r = await api('/panel/api/x-users?page=' + usersPage + '&limit=20&search=' + encodeURIComponent(usersSearch));
    const d = await r.json();
    const users = d.users || [];

    let html = '<div style="margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
      + '<button class="btn-small primary" onclick="syncAllUsers()" style="padding:6px 14px">Sync All</button>'
      + '<span id="syncMsg" style="font-size:0.8rem;color:#71767b"></span>'
      + '<input id="usersSearchInput" placeholder="Search username..." value="' + escHtml(usersSearch) + '"'
      + ' onkeydown="if(event.key===\'Enter\'){usersSearch=this.value;usersPage=1;loadUsers()}"'
      + ' style="margin-left:auto;background:#0e0e12;border:1px solid #2a2a38;border-radius:8px;color:#e7e9ea;padding:6px 10px;font-size:0.8rem;outline:none;width:180px">'
      + '<button class="btn-small primary" onclick="usersSearch=document.getElementById(\'usersSearchInput\').value;usersPage=1;loadUsers()">Search</button>'
      + '</div>';

    if (users.length === 0) {
      html += '<div class="empty-state">No users yet</div>';
      el.innerHTML = html;
      return;
    }

    let rows = '';
    for (const u of users) {
      const followsClass = u.we_follow ? 'status-approved' : 'status-rejected';
      const followsText = u.we_follow ? 'Yes' : 'No';
      const fbClass = u.follows_us ? 'status-approved' : 'status-rejected';
      const fbText = u.follows_us ? 'Yes' : 'No';
      const blockedClass = u.blocked ? 'status-rejected' : 'status-approved';
      const blockedText = u.blocked ? 'Blocked' : 'Active';
      rows += '<tr>'
        + '<td><div style="display:flex;align-items:center;gap:8px">'
        + '<div style="width:32px;height:32px;border-radius:50%;overflow:hidden;background:#2a2a38;flex-shrink:0">'
        + (u.avatar_url ? '<img src="' + u.avatar_url + '" style="width:100%;height:100%;object-fit:cover">' : '')
        + '</div>'
        + '<a href="javascript:void(0)" onclick="showUserTweets(' + u.id + ')" style="color:#1d9bf0;text-decoration:none">@' + escHtml(u.screen_name) + '</a>'
        + '</div></td>'
        + '<td>' + escHtml(u.name || '-') + '</td>'
        + '<td><span class="status-badge ' + followsClass + '">' + followsText + '</span></td>'
        + '<td><span class="status-badge ' + fbClass + '">' + fbText + '</span></td>'
        + '<td><span class="status-badge ' + blockedClass + '">' + blockedText + '</span></td>'
        + '<td>' + fmtTime(u.last_login_at) + '</td>'
        + '<td>'
        + (u.blocked
            ? '<button class="btn-small primary" onclick="unblockUser(' + u.id + ')" style="margin-right:4px">Unblock</button>'
            : '<button class="btn-small danger" onclick="blockUser(' + u.id + ')" style="margin-right:4px">Block</button>')
        + (u.follows_us
            ? '<button class="btn-small danger" onclick="unfollowUser(' + u.id + ')" style="margin-right:4px">Unfollow</button>'
            : '<button class="btn-small primary" onclick="followUser(' + u.id + ')" style="margin-right:4px">Follow</button>')
        + '</td></tr>';
    }

    const totalPages = Math.ceil((d.total || users.length) / 20);
    html += '<div class="table-wrap"><table style="font-size:0.8rem"><thead><tr>'
      + '<th>User</th><th>Name</th><th>Follows @unsrifess</th><th>Followed Back</th><th>Status</th><th>Last Login</th><th>Action</th>'
      + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
      + '<div class="pagination">'
      + '<button onclick="usersPage--;loadUsers()"' + (usersPage <= 1 ? ' disabled' : '') + '>Prev</button>'
      + '<span class="page-info">Page ' + usersPage + ' of ' + totalPages + '</span>'
      + '<button onclick="usersPage++;loadUsers()"' + (usersPage >= totalPages ? ' disabled' : '') + '>Next</button>'
      + '</div>';

    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = '<div class="empty-state" style="color:#f4212e">Failed to load users</div>';
  }
}

async function followUser(id) {
  try {
    const r = await api('/panel/api/x-users/' + id + '/follow', { method: 'POST' });
    const d = await r.json();
    if (d.success) { loadUsers(); loadStats(); }
    else { showPopup('⚠️', 'Follow Failed', d.error || 'Failed to follow user', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]); }
  } catch(e) { showPopup('⚠️', 'Error', 'Connection error', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]); }
}

async function unfollowUser(id) {
  showPopup('', 'Unfollow?', 'Unfollow this user?', [
    { text: 'Cancel', cls: 'popup-btn-ghost', fn: closePopup },
    { text: 'Unfollow', cls: 'popup-btn-danger', fn: async () => {
      closePopup();
      try {
        const r = await api('/panel/api/x-users/' + id + '/unfollow', { method: 'POST' });
        const d = await r.json();
        if (d.success) { loadUsers(); loadStats(); }
        else { showPopup('⚠️', 'Unfollow Failed', d.error || 'Failed to unfollow', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]); }
      } catch(e) { showPopup('⚠️', 'Error', 'Connection error', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]); }
    } },
  ]);
}

async function blockUser(id) {
  showPopup('', 'Block User?', 'Block this user from using the application?', [
    { text: 'Cancel', cls: 'popup-btn-ghost', fn: closePopup },
    { text: 'Block', cls: 'popup-btn-danger', fn: async () => {
      closePopup();
      try {
        const r = await api('/panel/api/x-users/' + id + '/block', { method: 'POST' });
        const d = await r.json();
        if (d.success) { loadUsers(); }
        else { showPopup('⚠️', 'Block Failed', 'Failed to block user', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]); }
      } catch(e) { showPopup('⚠️', 'Error', 'Connection error', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]); }
    } },
  ]);
}

async function unblockUser(id) {
  try {
    const r = await api('/panel/api/x-users/' + id + '/unblock', { method: 'POST' });
    const d = await r.json();
    if (d.success) { loadUsers(); }
    else { showPopup('⚠️', 'Unblock Failed', 'Failed to unblock user', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]); }
  } catch(e) { showPopup('⚠️', 'Error', 'Connection error', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]); }
}

async function syncAllUsers() {
  const msg = document.getElementById('syncMsg');
  if (msg) msg.textContent = 'Syncing...';
  try {
    await api('/panel/api/x-users/sync-all', { method: 'POST' });
    const poll = setInterval(async () => {
      try {
        const r = await api('/panel/api/x-users/sync-status');
        const d = await r.json();
        if (d.status === 'done') {
          clearInterval(poll);
          if (msg) msg.textContent = 'Synced: ' + d.synced + ', errors: ' + d.errors;
          loadUsers();
          loadStats();
        } else if (d.status === 'running') {
          if (msg) msg.textContent = 'Syncing... ' + (d.synced + d.errors) + '/' + d.total;
        }
      } catch { clearInterval(poll); if (msg) msg.textContent = 'Sync failed'; }
    }, 2000);
  } catch(e) {
    if (msg) msg.textContent = 'Sync failed';
  }
}

// ─── Tab Switching ────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelector('.tab[data-tab="' + name + '"]').classList.add('active');
  document.getElementById('tab' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('active');

  if (name === 'queue') loadQueue();
  if (name === 'history') loadHistory();
  if (name === 'users') loadUsers();
  if (name === 'settings') loadSettings();
}

// ─── Init & Auto-refresh ──────────────────────────────────
loadStats();
loadQueue();
setInterval(() => {
  const active = document.querySelector('.tab-content.active');
  if (active && active.id === 'tabQueue') loadQueue();
  loadStats();
}, 15000);
</script>
