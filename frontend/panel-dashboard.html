<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel Dashboard — Unsr!fess</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #000; color: #e7e9ea; min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
  }
  .container { width: 100%; max-width: 480px; padding: 12px 16px 24px; }

  /* ── Topbar ── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px 0; width: 100%; max-width: 480px;
  }
  .topbar h1 {
    font-size: 1.15rem; font-weight: 700;
    background: linear-gradient(135deg, #1d9bf0, #8b5cf6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .topbar h1 span { -webkit-text-fill-color: #71767b; font-weight: 400; }
  .topbar-right { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: #71767b; }
  .topbar-right .admin-name { color: #1d9bf0; font-weight: 500; }
  .topbar-right .role-badge {
    font-size: 0.6rem; padding: 1px 6px; border-radius: 9999px;
    background: rgba(29,155,240,0.12); color: #1d9bf0; text-transform: uppercase;
  }
  .topbar-right .role-badge.super { background: rgba(244,196,48,0.12); color: #f4c430; }
  .logout-btn {
    background: transparent; border: 1px solid #2f3336; color: #e7e9ea;
    padding: 4px 10px; border-radius: 9999px; cursor: pointer; font-size: 0.72rem;
    line-height: 1.4;
  }
  .logout-btn:hover { border-color: #f4212e; color: #f4212e; }

  /* ── Stats ── */
  .stats { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .stat-row { display: flex; gap: 3px; overflow: hidden; }
  .stat-card {
    flex: 1; min-width: 0;
    background: #16181c; border: 1px solid #2f3336; border-radius: 8px;
    padding: 5px 2px; text-align: center;
    display: flex; flex-direction: column; justify-content: center;
  }
  .stat-card .num { font-size: 0.8rem; font-weight: 700; line-height: 1.2; }
  .stat-card .label { font-size: 0.5rem; color: #71767b; line-height: 1.1; margin-top: 1px; }
  .stat-card .num.approved { color: #00ba7c; }
  .stat-card .num.rejected { color: #f4212e; }
  .stat-card .num.deleted { color: #71767b; }
  .stat-card .num.total-subs { color: #1d9bf0; }
  .stat-card .num.subs-today { color: #1d9bf0; opacity: 0.7; }
  .stat-card .num.approved-today { color: #00ba7c; opacity: 0.7; }
  .stat-card .num.rejected-today { color: #f4212e; opacity: 0.7; }
  .stat-card .num.deleted-today { color: #71767b; opacity: 0.7; }
  .stat-card .num.total-users { color: #6b5b95; }
  .stat-card .num.active-users { color: #00ba7c; }
  .stat-card .num.inactive-users { color: #71767b; }
  .stat-card .num.active-submitters { color: #1d9bf0; }
  .stat-card .num.unique-today { color: #1d9bf0; }
  .stat-card .num.total-unique { color: #6b5b95; }
  .section-label { width: 100%; font-size: 0.65rem; font-weight: 600; color: #71767b; text-transform: uppercase; letter-spacing: 0.4px; margin: 6px 0 1px 0; }
  .badge-on, .badge-off { display: inline-block; padding: 2px 10px; border-radius: 9999px; font-size: 0.72rem; font-weight: 600; }
  .badge-on { background: rgba(0,186,124,0.12); color: #00ba7c; }
  .badge-off { background: rgba(244,33,46,0.12); color: #f4212e; }

  /* ── Tabs ── */
  .tabs { display: flex; gap: 0; margin-bottom: 12px; border-bottom: 1px solid #2f3336; overflow-x: auto; }
  .tab {
    padding: 10px 14px; cursor: pointer; font-size: 0.8rem; font-weight: 500;
    color: #71767b; border-bottom: 2px solid transparent; white-space: nowrap;
    transition: color .15s;
  }
  .tab:hover { color: #e7e9ea; }
  .tab.active { color: #1d9bf0; border-bottom-color: #1d9bf0; }
  .tab .badge {
    display: inline-block; margin-left: 4px; font-size: 0.62rem;
    padding: 0 6px; border-radius: 9999px; background: #1d9bf0; color: #fff;
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .stab-content { display: block; }
  .stab-content.hidden { display: none; }

  /* ── Cards (generic) ── */
  .item-card {
    background: #16181c; border: 1px solid #2f3336; border-radius: 14px;
    padding: 14px; margin-bottom: 8px;
  }
  .item-card:last-child { margin-bottom: 0; }
  .item-card .meta { font-size: 0.72rem; color: #71767b; }
  .item-card .text {
    font-size: 0.88rem; line-height: 1.5; margin-bottom: 10px;
    white-space: pre-wrap; word-break: break-word;
  }
  .text-preview {
    font-size: 0.88rem; line-height: 1.5; margin-bottom: 10px;
    white-space: pre-wrap; word-break: break-word; overflow-wrap: break-word;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .img-tag { display: inline-block; padding: 2px 10px; border-radius: 9999px; font-size: 0.68rem; font-weight: 600; }
  .img-tag.card-tag { background: rgba(29,155,240,0.12); color: #1d9bf0; }
  .img-tag.media-tag { background: rgba(0,186,124,0.12); color: #00ba7c; }
  .partial-badge { display: inline-block; padding: 2px 10px; border-radius: 9999px; font-size: 0.68rem; font-weight: 600; background: rgba(255,173,31,0.15); color: #ffad1f; align-self:center; }
  .item-card .meta-row {
    display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.72rem; color: #71767b;
    margin-top: 8px;
  }
  .item-card .actions { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #2f3336; flex-wrap: wrap; }
  .item-card .actions .btn-action {
    padding: 8px 18px; border: none; border-radius: 9999px;
    font-size: 0.8rem; font-weight: 600; cursor: pointer; color: #fff;
    transition: opacity .2s;
  }
  .item-card .actions .btn-action:hover { opacity: .85; }
  .btn-action {
    padding: 8px 18px; border: none; border-radius: 9999px;
    font-size: 0.8rem; font-weight: 600; cursor: pointer; color: #fff;
    transition: opacity .2s;
  }
  .btn-action:hover { opacity: .85; }
  .btn-approve { background: #00ba7c; }
  .btn-reject { background: #f4212e; }
  .btn-delete { background: #f4212e; }
  .btn-primary-sm { background: #1d9bf0; }
  .btn-primary-sm:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-danger-sm { background: #f4212e; }
  .btn-secondary-sm {
    background: transparent; border: 1px solid #2f3336; color: #e7e9ea;
  }
  .btn-secondary-sm:hover { background: rgba(239,243,244,0.04); }
  .btn-sm {
    padding: 6px 14px; border: none; border-radius: 9999px;
    font-size: 0.75rem; font-weight: 600; cursor: pointer; color: #fff;
    transition: opacity .2s;
  }
  .btn-sm:hover { opacity: .85; }
  .btn-small { padding: 6px 14px; border: none; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; cursor: pointer; color: #fff; transition: opacity .2s; display: inline-flex; align-items: center; justify-content: center; }
  .btn-small:hover { opacity: .85; }
  .btn-small.primary { background: #1d9bf0; }
  .btn-small.danger { background: #f4212e; }

  .empty-state { text-align: center; padding: 40px 16px; color: #71767b; font-size: 0.85rem; }

  /* ── Thumbnails ── */
  .thumb-grid { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .thumb {
    width: 72px; height: 72px; border-radius: 10px; overflow: hidden;
    border: 1px solid #2f3336; cursor: pointer; flex-shrink: 0;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb:hover { border-color: #1d9bf0; }

  /* ── Lightbox ── */
  .lightbox {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.92); display: flex;
    align-items: center; justify-content: center;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .lightbox.hidden { display: none; }
  .lightbox .close-btn {
    position: absolute; top: 20px; right: 20px; z-index: 10;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.1); border: none;
    color: #e7e9ea; font-size: 1.4rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background .15s;
  }
  .lightbox .close-btn:hover { background: rgba(255,255,255,0.22); }
  .lightbox .nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 10;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,0.08); border: none;
    color: #e7e9ea; font-size: 1.4rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background .15s;
  }
  .lightbox .nav-btn:hover { background: rgba(255,255,255,0.18); }
  .lightbox .nav-btn.prev { left: 20px; }
  .lightbox .nav-btn.next { right: 20px; }
  .lightbox img { max-width: 94%; max-height: 92%; border-radius: 12px; object-fit: contain; box-shadow: 0 8px 40px rgba(0,0,0,0.5); }
  .lightbox .lb-counter {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 10;
    background: rgba(0,0,0,0.6); color: rgba(255,255,255,0.7);
    font-size: 0.8rem; padding: 4px 14px; border-radius: 9999px;
  }

  /* ── Popup (bottom sheet) ── */
  .popup-overlay {
    position: fixed; inset: 0; z-index: 150;
    background: rgba(0,0,0,0.6);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .popup-overlay.hidden { display: none; }
  .popup-card {
    width: 100%; max-width: 480px; background: #16181c;
    border-radius: 24px 24px 0 0; padding: 28px 24px 32px;
    text-align: center; animation: sheetUp .3s ease; max-height: 85vh; overflow-y: auto;
  }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .popup-card.large {
    max-width: min(90vw, 480px);
    text-align: left;
  }
  .popup-icon { font-size: 2rem; margin-bottom: 12px; }
  .popup-title { font-size: 1rem; font-weight: 600; margin-bottom: 8px; }
  .popup-msg { font-size: 0.88rem; color: #71767b; margin-bottom: 20px; line-height: 1.5; }
  .popup-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .popup-btn {
    padding: 12px 28px; border: none; border-radius: 9999px;
    font-size: 0.9rem; font-weight: 600; cursor: pointer; color: #fff; transition: opacity .2s;
  }
  .popup-btn:hover { opacity: .85; }
  .popup-btn-primary { background: #1d9bf0; }
  .popup-btn-danger { background: #f4212e; }
  .popup-btn-ghost { background: #2f3336; color: #e7e9ea; }

  /* ── Filter bar ── */
  .filter-bar {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: center;
  }
  .filter-bar select, .filter-bar input {
    background: #0e0e12; border: 1px solid #2f3336; border-radius: 9999px;
    color: #e7e9ea; padding: 8px 14px; font-size: 0.8rem; outline: none; font-family: inherit;
  }
  .filter-bar select:focus, .filter-bar input:focus { border-color: #1d9bf0; }
  .filter-bar .btn-sm { padding: 8px 18px; }

  /* ── Status badges ── */
  .status-badge {
    display: inline-block; padding: 2px 10px; border-radius: 9999px;
    font-size: 0.68rem; font-weight: 600;
  }
  .status-pending { background: rgba(244,196,48,0.12); color: #f4c430; }
  .status-approved { background: rgba(0,186,124,0.12); color: #00ba7c; }
  .status-rejected { background: rgba(244,33,46,0.12); color: #f4212e; }
  .status-deleted { background: rgba(113,118,123,0.12); color: #71767b; }

  /* ── Keyword tags ── */
  .keyword-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .keyword-tag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 12px; border-radius: 9999px; font-size: 0.8rem;
    background: rgba(29,155,240,0.08); border: 1px solid rgba(29,155,240,0.2);
  }
  .keyword-tag .del {
    cursor: pointer; color: #f4212e; font-weight: 700; font-size: 0.85rem; line-height: 1;
  }
  .keyword-tag .del:hover { color: #c8102e; }
  .add-keyword-form { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .add-keyword-form input { flex: 1; min-width: 140px; }

  /* ── Pagination ── */
  .pagination {
    display: flex; gap: 6px; justify-content: center; margin-top: 12px; align-items: center;
  }
  .pagination button {
    background: #16181c; border: 1px solid #2f3336; border-radius: 9999px;
    color: #e7e9ea; padding: 6px 16px; cursor: pointer; font-size: 0.8rem;
    transition: border-color .2s;
  }
  .pagination button:hover { border-color: #1d9bf0; }
  .pagination button:disabled { opacity: 0.3; cursor: not-allowed; }
  .pagination .page-info { color: #71767b; font-size: 0.8rem; }

  .msg { font-size: 0.8rem; min-height: 1.2em; margin-top: 6px; }
  .msg.ok { color: #00ba7c; }
  .msg.err { color: #f4212e; }

  /* ── Peak Hours Heatmap ── */
  .heatmap-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .heatmap {
    display: grid;
    grid-template-columns: 50px repeat(24, minmax(22px, 1fr));
    gap: 2px; font-size: 0.65rem; min-width: 0;
  }
  .heatmap .cell { padding: 4px 2px; text-align: center; border-radius: 4px; }
  .heatmap .label { color: #71767b; text-align: right; padding-right: 6px; font-size: 0.6rem; }
  .heatmap .header { color: #71767b; font-weight: 500; font-size: 0.6rem; }
  /* ── Settings cards ── */
  .settings-card {
    background: #16181c; border: 1px solid #2f3336; border-radius: 14px; padding: 16px; margin-bottom: 12px;
  }
  .settings-card:last-child { margin-bottom: 0; }
  .settings-card .label { font-size: 0.85rem; color: #e7e9ea; margin-bottom: 8px; }
  .settings-card .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .settings-card input, .settings-card textarea {
    background: #0e0e12; border: 1px solid #2f3336; border-radius: 14px;
    color: #e7e9ea; font-size: 0.85rem; padding: 10px 12px; outline: none; font-family: inherit;
    width: 100%;
  }
  .settings-card input:focus, .settings-card textarea:focus { border-color: #1d9bf0; }
  .settings-card textarea { resize: vertical; }
  .settings-card input[type="number"] { width: 60px; text-align: center; }
  .settings-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 0; border-bottom: 1px solid #2f3336;
  }
  .settings-item:last-child { border-bottom: none; }
  .settings-item span:first-child { font-size: 0.85rem; color: #e7e9ea; }

  /* ── Section titles ── */
  .section-title {
    font-size: 1rem; font-weight: 700; margin: 24px 0 16px; color: #e7e9ea;
  }

  .hidden { display: none !important; }

  /* ── Loading Overlay ── */
  .loading-overlay {
    position: fixed; inset: 0; z-index: 250;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
  }
  .loading-overlay.hidden { display: none; }
  .loading-overlay .spinner {
    width: 40px; height: 40px; border: 3px solid #2f3336;
    border-top-color: #1d9bf0; border-radius: 50%;
    animation: lspin .7s linear infinite;
  }
  @keyframes lspin { to { transform: rotate(360deg); } }
  .loading-overlay .loading-text { color: #e7e9ea; font-size: 0.9rem; font-weight: 500; }
  .loading-overlay .progress-track { width: 60%; height: 3px; background: #2f3336; border-radius: 3px; overflow: hidden; }
  .loading-overlay .progress-bar { height: 100%; width: 0%; background: #1d9bf0; transition: width .3s; }
</style>
</head>
<body>
<div class="topbar">
  <h1>Unsr!fess <span>Panel</span></h1>
  <div class="topbar-right">
    <span class="admin-name" id="adminName"></span>
    <span class="role-badge" id="roleBadge"></span>
    <button class="logout-btn" onclick="logout()">Log out</button>
  </div>
</div>

<div class="container">
  <div class="stats" id="statsRow"></div>

  <div id="peakHoursRow" style="margin-bottom:10px"></div>

  <div class="tabs" id="tabBar">
    <div class="tab active" data-tab="queue" onclick="switchTab('queue')">Queue <span class="badge" id="queueBadge">0</span></div>
    <div class="tab" data-tab="history" onclick="switchTab('history')">History</div>
    <div class="tab" data-tab="users" onclick="switchTab('users')">Users</div>
    <div class="tab" data-tab="settings" onclick="switchTab('settings')">Settings</div>
  </div>

  <div id="tabQueue" class="tab-content active"></div>
  <div id="tabHistory" class="tab-content"></div>
  <div id="tabUsers" class="tab-content"></div>
  <div id="tabSettings" class="tab-content"></div>
</div>

<!-- Lightbox -->
<div class="lightbox hidden" id="lightbox">
  <button class="close-btn" onclick="closeLightbox()" aria-label="Close">&times;</button>
  <button class="nav-btn prev" id="lbPrev" onclick="lbNav(-1)" aria-label="Previous">&#8249;</button>
  <button class="nav-btn next" id="lbNext" onclick="lbNav(1)" aria-label="Next">&#8250;</button>
  <img id="lbImg" src="" alt="preview">
  <span class="lb-counter hidden" id="lbCounter"></span>
</div>

<!-- Popup -->
  <div class="popup-overlay hidden" id="popupOverlay">
    <div class="popup-card" id="popupCard">
      <div class="popup-icon" id="popupIcon"></div>
      <div class="popup-title" id="popupTitle"></div>
      <div class="popup-msg" id="popupMsg"></div>
      <div class="popup-actions" id="popupActions"></div>
    </div>
  </div>

  <!-- Loading overlay for approve/delete -->
  <div class="loading-overlay hidden" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Loading...</div>
    <div class="progress-track">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

<script>
const TOKEN = localStorage.getItem('panel_token');
const ADMIN = JSON.parse(localStorage.getItem('panel_admin') || '{}');
let userIdFromPopup = 0;
let userTweetsPages = {};

if (!TOKEN) { window.location.href = '/admin-login'; }

try {
  const b64 = TOKEN.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
  const payload = JSON.parse(atob(b64));
  if (payload.type !== 'admin' || (payload.exp && payload.exp * 1000 < Date.now())) {
    logout();
  }
} catch (_) {}

const headers = { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/x-www-form-urlencoded' };
const api = (path, opts = {}) =>
  fetch(path, { ...opts, headers: { ...headers, ...opts.headers } }).then(r => {
    if (r.status === 401) { logout(); throw new Error('Unauthorized'); }
    return r;
  });

document.getElementById('adminName').textContent = ADMIN.display_name || ADMIN.username;
const badge = document.getElementById('roleBadge');
badge.textContent = ADMIN.role || 'admin';
if (ADMIN.role === 'superadmin') badge.classList.add('super');

function logout() {
  localStorage.removeItem('panel_token');
  localStorage.removeItem('panel_admin');
  window.location.href = '/admin-login';
}

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtTime(dateStr) {
  const d = new Date(dateStr + (dateStr.endsWith('Z') ? '' : 'Z'));
  const pad = n => String(n).padStart(2, '0');
  return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear()
    + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}
function showFullFromAttr(el) {
  const imgs = el.dataset.images;
  let imgsHtml = '';
  if (imgs) {
    const fns = JSON.parse(imgs);
    if (fns.length) {
      imgsHtml = '<div class="thumb-grid" style="margin-bottom:12px;justify-content:center">';
      fns.forEach((fn, i) => {
        imgsHtml += '<div class="thumb" onclick=\'openLightbox(' + JSON.stringify(fns) + ',' + i + ')\'><img src="/panel/api/images/' + fn + '?token=' + TOKEN + '"></div>';
      });
      imgsHtml += '</div>';
    }
  }
  const textHtml = '<div style="white-space:pre-wrap;word-break:break-word;max-height:300px;overflow-y:auto;text-align:left">' + escHtml(el.dataset.full) + '</div>';
  showPopup('', '', imgsHtml + textHtml, [{text:'Close',cls:'popup-btn-ghost',fn:closePopup}]);
}
function escHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ── Popup ──
function showPopup(icon, title, msg, buttons, large) {
  const card = document.querySelector('.popup-card');
  card.classList.toggle('large', !!large);
  const iconEl = document.getElementById('popupIcon');
  iconEl.textContent = icon;
  iconEl.style.display = icon ? '' : 'none';
  const titleEl = document.getElementById('popupTitle');
  titleEl.textContent = title;
  titleEl.style.display = title ? '' : 'none';
  document.getElementById('popupMsg').innerHTML = msg;
  const actions = document.getElementById('popupActions');
  actions.innerHTML = '';
  (buttons || [{ text: 'OK', cls: 'popup-btn-primary', fn: closePopup }]).forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'popup-btn ' + (b.cls || 'popup-btn-primary');
    btn.textContent = b.text;
    btn.onclick = b.fn;
    actions.appendChild(btn);
  });
  document.getElementById('popupOverlay').classList.remove('hidden');
}
function closePopup() {
  document.getElementById('popupOverlay').classList.add('hidden');
}
document.getElementById('popupOverlay').addEventListener('click', function(e) {
  if (e.target === this) closePopup();
});
document.getElementById('popupCard').addEventListener('click', function(e) {
  e.stopPropagation();
});

// ── Lightbox ──
let lbImages = [];
let lbIndex = 0;

function openLightbox(images, idx) {
  lbImages = images;
  lbIndex = idx;
  showLbImage();
  document.getElementById('lightbox').classList.remove('hidden');
  document.getElementById('lbPrev').classList.toggle('hidden', images.length <= 1);
  document.getElementById('lbNext').classList.toggle('hidden', images.length <= 1);
  var ctr = document.getElementById('lbCounter');
  if (images.length > 1) { ctr.classList.remove('hidden'); ctr.textContent = (idx + 1) + ' / ' + images.length; }
  else { ctr.classList.add('hidden'); }
}
function closeLightbox() {
  document.getElementById('lightbox').classList.add('hidden');
  document.getElementById('lbImg').src = '';
  lbImages = [];
  lbIndex = 0;
}
function lbNav(dir) {
  lbIndex = (lbIndex + dir + lbImages.length) % lbImages.length;
  showLbImage();
  var ctr = document.getElementById('lbCounter');
  if (ctr && lbImages.length > 1) ctr.textContent = (lbIndex + 1) + ' / ' + lbImages.length;
}
function showLbImage() {
  document.getElementById('lbImg').src = '/panel/api/images/' + lbImages[lbIndex] + '?token=' + TOKEN;
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft' && !document.getElementById('lightbox').classList.contains('hidden')) lbNav(-1);
  if (e.key === 'ArrowRight' && !document.getElementById('lightbox').classList.contains('hidden')) lbNav(1);
});

// ─── Queue Tab ──────────────────────────────────────────
let queuePage = 1;
const loadPending = loadQueue;

function imagesFromTweet(t) {
  if (!t.image_paths) return [];
  try { return JSON.parse(t.image_paths); } catch { return []; }
}
function filenameFromPath(p) {
  return p.split(/[/\\]/).pop();
}

async function loadQueue() {
  const el = document.getElementById('tabQueue');
  try {
    const r = await api('/panel/api/tweets/pending?page=' + queuePage + '&limit=10');
    const d = await r.json();
    const tweets = d.tweets || [];
    document.getElementById('queueBadge').textContent = d.total || tweets.length;

    if (tweets.length === 0) {
      el.innerHTML = '<div class="empty-state">No pending tweets</div>';
      return;
    }

    let html = '';
    for (const t of tweets) {
      const isCard = t.send_as_image;
      const displayText = t.original_text || '';
      const images = imagesFromTweet(t);
      const fns = images.map(filenameFromPath);
      const hasImgs = fns.length > 0;
      let thumbsHtml = '';
      if (hasImgs) {
        thumbsHtml = '<div class="thumb-grid">';
        images.forEach((fp, idx) => {
          thumbsHtml += '<div class="thumb" onclick=\'openLightbox(' + JSON.stringify(fns) + ',' + idx + ')\'><img src="/panel/api/images/' + fns[idx] + '?token=' + TOKEN + '"></div>';
        });
        thumbsHtml += '</div>';
      }

      var tagHtml = '';
      if (isCard) {
        tagHtml = '<span class="img-tag card-tag">Card</span>';
      } else if (hasImgs) {
        tagHtml = '<span class="img-tag media-tag">' + fns.length + ' image' + (fns.length > 1 ? 's' : '') + '</span>';
      }

      let metaParts = [fmtTime(t.submitted_at)];
      if (t.chunk_count > 1) {
        let postedCount = 0;
        try { postedCount = JSON.parse(t.tweet_urls || '[]').length; } catch(e) {}
        if (t.status === 'partial') {
          metaParts.push(postedCount + '/' + t.chunk_count + ' posted');
        } else {
          metaParts.push(t.chunk_count + ' tweets');
        }
      }
      const metaStr = '<strong>#' + t.id + '</strong>' + (metaParts.length ? ' · ' + metaParts.join(' · ') : '');

      const userInfo = t.user_screen_name
        ? '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">'
          + '<div style="width:32px;height:32px;border-radius:50%;overflow:hidden;background:#2f3336;flex-shrink:0">'
          + (t.user_avatar_url ? '<img src="' + t.user_avatar_url + '" style="width:100%;height:100%;object-fit:cover">' : '')
          + '</div>'
          + '<div style="flex:1;min-width:0">'
          + '<div style="font-size:0.85rem;font-weight:500;color:#1d9bf0;cursor:pointer" onclick="showUserTweets(' + t.x_user_db_id + ')">@' + escHtml(t.user_screen_name) + '</div>'
          + '<div class="meta">' + metaStr + '</div>'
          + '</div>'
          + '</div>'
        : '<div class="meta" style="margin-bottom:10px">' + metaStr + '</div>';

      const displayFull = t.original_text || '';

      html += '<div class="item-card" id="qt-' + t.id + '">'
        + userInfo
        + thumbsHtml
        + '<div class="text" data-full="' + escHtml(displayFull).replace(/"/g, '&quot;') + '" onclick="showFullFromAttr(this)" style="cursor:pointer">' + escHtml(displayText) + '</div>'
        + '<div class="actions" id="qa-' + t.id + '">'
        + (t.status === 'partial' ? '<span class="partial-badge">Partial</span>' : '')
        + '<button class="btn-action btn-approve" onclick="approveTweet(' + t.id + ')">' + (t.status === 'partial' ? 'Retry' : 'Approve') + '</button>'
        + '<button class="btn-action btn-reject" onclick="rejectTweetPopup(' + t.id + ')">Reject</button>'
        + '</div>'
        + '</div>';
    }

    const totalPages = Math.ceil((d.total || tweets.length) / 10);
    html += '<div class="pagination">'
      + '<button onclick="queuePage--;loadQueue()"' + (queuePage <= 1 ? ' disabled' : '') + '>Prev</button>'
      + '<span class="page-info">Page ' + queuePage + ' of ' + totalPages + '</span>'
      + '<button onclick="queuePage++;loadQueue()"' + (queuePage >= totalPages ? ' disabled' : '') + '>Next</button>'
      + '</div>';

    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = '<div class="empty-state" style="color:#f4212e">Failed to load queue</div>';
  }
}

// ── Loading overlay (SSE-based for approve/delete) ──
let _currentTaskId = null;
let _taskFallbackTimer = null;

function showLoading(taskId, label) {
  if (_currentTaskId) hideLoading();
  const overlay = document.getElementById('loadingOverlay');
  const bar = document.getElementById('progressBar');
  const text = document.getElementById('loadingText');
  _currentTaskId = taskId || null;
  bar.style.width = '0%';
  text.textContent = label || 'Loading...';
  overlay.classList.remove('hidden');

  if (taskId) {
    _taskFallbackTimer = setTimeout(async () => {
      try {
        const r = await api('/panel/api/tasks/' + taskId + '/progress');
        const d = await r.json();
        if (d.status === 'done') {
          _handleTaskDone(d);
        }
      } catch (_) { console.warn('task_progress parse failed'); }
      if (_currentTaskId) hideLoading();
    }, 60000);
  }
}

function hideLoading() {
  const overlay = document.getElementById('loadingOverlay');
  overlay.classList.add('hidden');
  document.getElementById('progressBar').style.width = '0%';
  if (_taskFallbackTimer) { clearTimeout(_taskFallbackTimer); _taskFallbackTimer = null; }
  _currentTaskId = null;
}

function _handleTaskDone(d) {
  hideLoading();
  if (d.type === 'approve') {
    loadStats();
    if (d.result === 'success') {
      if (d.warning) {
        showPopup('⚠️', 'Partial Success', d.warning, [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]);
      }
    } else {
      showPopup('⚠️', 'Approve Failed', d.error || 'Unknown error', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]);
    }
  } else if (d.type === 'delete') {
    loadStats();
    loadHistory();
    if (d.result === 'success') {
      const deleted = d.deleted || 0;
      const failed = d.failed || 0;
      if (failed > 0) {
        showPopup('⚠️', 'Partial Delete', deleted + ' deleted, ' + failed + ' failed.', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]);
      }
    } else {
      showPopup('⚠️', 'Delete Failed', d.error || 'Unknown error', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]);
    }
  }
}

async function approveTweet(id) {
  const btn = document.querySelector('#qa-' + id + ' .btn-approve');
  if (btn) { btn.disabled = true; btn.textContent = 'Approving...'; }
  try {
    const r = await api('/panel/api/tweets/' + id + '/approve', { method: 'POST' });
    const d = await r.json();
    if (d.success && d.task_id) {
      const card = document.getElementById('qt-' + id);
      if (card) card.style.display = 'none';
      showLoading(d.task_id, 'Starting...');
    } else {
      if (btn) { btn.disabled = false; btn.textContent = 'Approve'; }
      showPopup('⚠️', 'Approve Failed', d.error || 'Could not start approval.', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]);
    }
  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Approve'; }
    showPopup('⚠️', 'Error', 'Connection error.', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]);
  }
}

async function rejectTweetPopup(id) {
  showPopup('', '', ''
    + '<div style="margin-bottom:12px">Reject tweet #' + id + '?</div>'
    + '<textarea id="rr-' + id + '" placeholder="Reason (optional)" rows="2" style="width:100%;background:#0e0e12;border:1px solid #2f3336;border-radius:8px;color:#e7e9ea;font-size:0.8rem;padding:8px 10px;outline:none;font-family:inherit;resize:vertical;box-sizing:border-box"></textarea>', [
    { text: 'Cancel', cls: 'popup-btn-ghost', fn: closePopup },
    { text: 'Reject', cls: 'popup-btn-danger', fn: async () => {
      closePopup();
      showLoading(null, 'Rejecting...');
      const reason = document.getElementById('rr-' + id).value;
      try {
        const form = new URLSearchParams();
        form.append('reason', reason);
        const r = await api('/panel/api/tweets/' + id + '/reject', {
          method: 'POST', headers: { ...headers, 'Content-Type': 'application/x-www-form-urlencoded' },
          body: form.toString(),
        });
        const d = await r.json();
        hideLoading();
        if (d.success) {
          const card = document.getElementById('qt-' + id);
          if (card) card.style.display = 'none';
          loadStats();
        } else {
          showPopup('⚠️', 'Reject Failed', d.detail || 'Could not reject.', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]);
        }
      } catch(e) {
        hideLoading();
        showPopup('⚠️', 'Error', 'Connection error', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]);
      }
    } },
  ]);
}

let historyPage = 1;

async function loadHistory() {
  const el = document.getElementById('tabHistory');
  const status = document.getElementById('hf-status')?.value || '';
  const search = document.getElementById('hf-search')?.value || '';

  let params = 'page=' + historyPage + '&limit=10';

      + '<select id="hf-status" onchange="historyPage=1;loadHistory()">'
      + '<option value="">All status</option>'

      + '<option value="partial"' + (status === 'partial' ? ' selected' : '') + '>Partial</option>'
      + '<option value="approved"' + (status === 'approved' ? ' selected' : '') + '>Approved</option>'

      + '<option value="deleted"' + (status === 'deleted' ? ' selected' : '') + '>Deleted</option>'

      return;
    }

    let cards = '';
    for (const t of tweets) {
      const isCard = t.send_as_image;
      var urls = [];
      try { urls = t.tweet_urls ? JSON.parse(t.tweet_urls) : []; } catch(e) { urls = []; }
      const images = imagesFromTweet(t);
      const fns = images.map(filenameFromPath);

        + '<span class="status-badge status-' + t.status + '">' + t.status + '</span>'
        + (tagHtml ? ' ' + tagHtml : '')
        + '<span>' + fmtTime(t.submitted_at) + '</span>'
        + '</div>'
        + '<div class="text-preview"' + (dataImgs ? ' ' + dataImgs : '') + ' data-full="' + escHtml(displayFull).replace(/"/g, '&quot;') + '" onclick="showFullFromAttr(this)" style="cursor:pointer">' + escHtml(displayText) + '</div>'
        + '<div class="meta" style="display:flex;gap:12px;flex-wrap:wrap;font-size:0.75rem;color:#71767b">'
        + '<span>Reviewer: ' + (t.reviewer_name || '-') + '</span>'
        + '<span>User: ' + (t.user_screen_name ? '<a href="javascript:void(0)" onclick="showUserTweets(' + t.x_user_db_id + ')" style="color:#1d9bf0;text-decoration:none">@' + escHtml(t.user_screen_name) + '</a>' : '-') + '</span>'

    if (tweets.length === 0) {
      html += '<div class="empty-state">No tweets from this user</div>';
    } else {
      let cardsHtml = '';
      for (const t of tweets) {
        var urls = [];
        try { urls = t.tweet_urls ? JSON.parse(t.tweet_urls) : []; } catch(e) { urls = []; }
        const linkHtml = urls.length ? '<a href="' + urls[0] + '" target="_blank" style="color:#1d9bf0">link</a>' : '';
        let actHtml = '';
        if (t.status === 'pending') {
          actHtml = '<button class="btn-action btn-approve" onclick="doApproval(' + t.id + ',\'' + d.screen_name + '\')">Approve</button>'
            + '<button class="btn-action btn-reject" onclick="doRejection(' + t.id + ',\'' + d.screen_name + '\')">Reject</button>';
        } else if (t.status === 'approved') {
          if (ADMIN.role === 'superadmin') {
            actHtml = '<button class="btn-action btn-reject" onclick="deleteTweetFromPopup(' + t.id + ')">Delete</button>';
          }
        }
        const tIsCard = t.send_as_image;
        const tImgs = t.image_paths ? (function(){try{return JSON.parse(t.image_paths).map(function(p){var parts=p.replace(/\\/g,'/').split('/');return parts[parts.length-1];});}catch(e){return [];}})() : [];
        const tHasImgs = tImgs.length > 0;
        var tTagHtml = '';
        if (tIsCard) {
          tTagHtml = '<span class="img-tag card-tag">Card</span>';
        } else if (tHasImgs) {
          tTagHtml = '<span class="img-tag media-tag">' + tImgs.length + ' image' + (tImgs.length > 1 ? 's' : '') + '</span>';
        }
        cardsHtml += '<div class="item-card" style="margin-bottom:8px">'
          + '<div class="meta" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px">'
          + '<strong>#' + t.id + '</strong>'
          + '<span class="status-badge status-' + t.status + '">' + t.status + '</span>'
          + (tTagHtml ? ' ' + tTagHtml : '')
          + '<span style="font-size:0.75rem;color:#71767b">' + fmtTime(t.submitted_at) + '</span>'
          + '</div>'
          + '<div class="text" style="font-size:0.85rem">' + escHtml(t.original_text) + '</div>'
          + '<div class="meta" style="display:flex;gap:12px;flex-wrap:wrap;font-size:0.75rem;color:#71767b;margin-top:6px">'
          + '<span>Reviewer: ' + (t.reviewer_name || '-') + '</span>'
          + '<span>Reason: ' + (t.reject_reason ? escHtml(t.reject_reason) : '-') + '</span>'
          + '<span>URL: ' + linkHtml + '</span>'
          + '</div>'
          + (actHtml ? '<div class="actions" style="margin-top:8px">' + actHtml + '</div>' : '')
          + '</div>';
      }
      html += cardsHtml;
      html += '<div class="pagination" style="margin-top:12px">'
        + '<button onclick="userTweetsPages[' + userId + ']=' + (page - 1) + ';showUserTweets(' + userId + ')"' + (page <= 1 ? ' disabled' : '') + '>Prev</button>'
        + '<span class="page-info">Page ' + page + ' of ' + totalPages + '</span>'
        + '<button onclick="userTweetsPages[' + userId + ']=' + (page + 1) + ';showUserTweets(' + userId + ')"' + (page >= totalPages ? ' disabled' : '') + '>Next</button>'
        + '</div>';
    }
    html += '</div>';
    showPopup('', 'User Tweets', html, null, true);
  } catch(e) {
    showPopup('⚠️', 'Error', 'Failed to load user tweets');
  }
}

async function doApproval(id, sn) {
  closePopup();
  showLoading(null, 'Approving...');
  try {
    const r = await api('/panel/api/tweets/' + id + '/approve', { method: 'POST' });
    const d = await r.json();
    if (d.success && d.task_id) {
      showUserTweets(userIdFromPopup);
      loadPending();
      loadStats();
      loadHistory();
      showLoading(d.task_id, 'Starting...');
    } else {
      hideLoading();
      showPopup('⚠️', 'Approve Failed', d.error || 'Failed to start approval', null, true);
    }
  } catch(e) { hideLoading(); showPopup('⚠️', 'Error', 'Connection error'); }
}

async function doRejection(id, sn) {
  closePopup();
  showPopup('', 'Reject Tweet?', ''
    + '<div style="margin-bottom:12px">Reject this tweet from @' + sn + '?</div>'
    + '<textarea id="rejectReason" placeholder="Reason (optional)" rows="2" style="width:100%;background:#0e0e12;border:1px solid #2f3336;border-radius:8px;color:#e7e9ea;font-size:0.8rem;padding:8px 10px;outline:none;font-family:inherit;resize:vertical;box-sizing:border-box"></textarea>', [
    { text: 'Cancel', cls: 'popup-btn-ghost', fn: closePopup },
    { text: 'Reject', cls: 'popup-btn-danger', fn: async () => {
      const reason = document.getElementById('rejectReason').value;
      closePopup();
      showLoading(null, 'Rejecting...');
      try {
        const body = new URLSearchParams();
        if (reason) body.append('reason', reason);
        const r = await api('/panel/api/tweets/' + id + '/reject', { method: 'POST', body });
        const d = await r.json();
        hideLoading();
        if (d.success) {
          showUserTweets(userIdFromPopup);
          loadPending();
          loadHistory();
        } else {
          showPopup('⚠️', 'Reject Failed', d.error || 'Failed to reject tweet', null, true);
        }
      } catch(e) { hideLoading(); showPopup('⚠️', 'Error', 'Connection error'); }
    } },
  ], true);
}

async function deleteTweetFromPopup(id) {
  closePopup();
  showPopup('🗑️', 'Delete Tweet?', ''
    + '<div style="margin-bottom:12px">Tweet #' + id + ' will be deleted from X. This cannot be undone.</div>'
    + '<textarea id="delReasonPopup" placeholder="Reason for deletion (optional)" rows="2" style="width:100%;background:#0e0e12;border:1px solid #2f3336;border-radius:8px;color:#e7e9ea;font-size:0.8rem;padding:8px 10px;outline:none;font-family:inherit;resize:vertical;box-sizing:border-box"></textarea>', [
    { text: 'Cancel', cls: 'popup-btn-ghost', fn: closePopup },
    { text: 'Delete', cls: 'popup-btn-danger', fn: async () => {
      const reason = document.getElementById('delReasonPopup').value;
      closePopup();
      showLoading(null, 'Deleting...');
      try {
        let url = '/panel/api/tweets/' + id;
        if (reason) url += '?reason=' + encodeURIComponent(reason);
        const r = await api(url, { method: 'DELETE' });
        const d = await r.json();
        hideLoading();
        if (d.success) {
          if (d.task_id) {
            showLoading(d.task_id, 'Deleting...');
          } else {
            showUserTweets(userIdFromPopup);
            loadStats();
            loadHistory();
          }
        } else {
          showPopup('⚠️', 'Delete Failed', d.error || 'Failed to delete tweet', null, true);
        }
      } catch(e) { hideLoading(); showPopup('⚠️', 'Error', 'Connection error'); }
    } },
  ], true);
}

async function deleteTweet(id) {
  showPopup('🗑️', 'Delete Tweet?', ''
    + '<div style="margin-bottom:12px">Tweet #' + id + ' will be deleted from X. This cannot be undone.</div>'
    + '<textarea id="delReason" placeholder="Reason for deletion (optional)" rows="2" style="width:100%;background:#0e0e12;border:1px solid #2f3336;border-radius:8px;color:#e7e9ea;font-size:0.8rem;padding:8px 10px;outline:none;font-family:inherit;resize:vertical;box-sizing:border-box"></textarea>', [
    { text: 'Cancel', cls: 'popup-btn-ghost', fn: closePopup },
    { text: 'Delete', cls: 'popup-btn-danger', fn: async () => { closePopup(); await doDelete(id, document.getElementById('delReason').value); } },
  ]);
}
async function doDelete(id, reason) {
  showLoading(null, 'Deleting...');
  try {
    let url = '/panel/api/tweets/' + id;
    if (reason) url += '?reason=' + encodeURIComponent(reason);
    const r = await api(url, { method: 'DELETE' });
    const d = await r.json();
    hideLoading();
    if (d.success) {
      if (d.task_id) {
        showLoading(d.task_id, 'Deleting...');
      } else {
        loadHistory();
        loadStats();
      }
    } else { showPopup('⚠️', 'Error', d.detail || 'Delete failed', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]); }
  } catch(e) { hideLoading(); showPopup('⚠️', 'Error', 'Connection error', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]); }
}

async function loadKeywordsSection() {
  const el = document.getElementById('kwList');
  try {
    const r = await api('/panel/api/keywords');

    el.innerHTML = keywords.length
      ? keywords.map(k => '<span class="keyword-tag">' + escHtml(k.keyword) + '<span class="del" onclick="removeKeyword(' + k.id + ')">&times;</span></span>').join('')

async function addKeyword() {
  const input = document.getElementById('kwInput');
  const val = input.value.trim();
  if (!val) return;
  const msg = document.getElementById('kwMsg');
  try {
    const form = new URLSearchParams();
    form.append('keywords', val);
    const r = await api('/panel/api/keywords', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: form.toString() });
    const d = await r.json();
    if (d.success) {
      input.value = '';

// ── Admin helpers ──
async function loadAdminsSection() {
  const el = document.getElementById('adminsTableWrap');
  try {
    const r = await api('/panel/api/admins');
    const admins = await r.json();
    let cards = '';
    for (const a of admins) {
      const lastLogin = a.last_login ? fmtTime(a.last_login) : '-';
      const activeHtml = a.is_active ? '<span style="color:#00ba7c">Active</span>' : '<span style="color:#71767b">Inactive</span>';
      const actionHtml = a.id !== ADMIN.id
        ? (a.is_active
            ? '<button class="btn-action btn-reject" onclick="deactivateAdmin(' + a.id + ')">Deactivate</button>'
            : '<button class="btn-action btn-approve" onclick="activateAdmin(' + a.id + ')">Reactivate</button>')
        : '<span style="color:#71767b;font-size:0.8rem">You</span>';
      cards += '<div class="item-card">'
        + '<div class="meta" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px">'
        + '<strong>#' + a.id + '</strong>'
        + '<span class="status-badge ' + (a.role === 'superadmin' ? 'status-approved' : 'status-pending') + '">' + a.role + '</span>'

async function xConnectStatus() {

    const handle = document.getElementById('xConnectHandle');
    const form = document.getElementById('xConnectForm');
    if (d.connected) {
      status.textContent = 'Connected';

      handle.textContent = '@' + (d.x_screen_name || '');
      var nameEl = document.getElementById('xConnectName');
      if (nameEl) nameEl.textContent = d.x_name ? d.x_name : '';
      form.style.display = 'none';
    } else {
      status.textContent = 'Disconnected';
      status.className = 'badge-off';
      handle.textContent = '';
      var nameEl = document.getElementById('xConnectName');
      if (nameEl) nameEl.textContent = '';
      form.style.display = 'block';
    }
  } catch(e) {
    const status = document.getElementById('xConnectStatus');
    if (status) { status.textContent = 'Error'; status.className = 'badge-off'; }

async function loadSettingsActivity() {
  const el = document.getElementById('activityTableWrap');
  const pagination = document.getElementById('activityPagination');
  try {
    const params = new URLSearchParams();
    params.set('page', stabActivityPage);
    params.set('limit', '10');
    const actionFilter = document.getElementById('af-action');
    if (actionFilter && actionFilter.value) params.set('action', actionFilter.value);

    const r = await api('/panel/api/activity?' + params.toString());
    const d = await r.json();
    const activities = d.activities || [];

    if (activities.length === 0) {
      el.innerHTML = '<div class="empty-state">No activity found</div>';
      pagination.innerHTML = '';
      return;
    }

    let cards = '';
    for (const a of activities) {
      cards += '<div class="item-card" style="margin-bottom:8px">'
        + '<div class="meta" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px">'
        + '<strong>' + escHtml(a.admin_name || 'Admin #' + a.admin_id) + '</strong>'
        + '<span class="status-badge status-pending">' + a.action + '</span>'
        + '<span style="font-size:0.75rem;color:#71767b">' + fmtTime(a.created_at) + '</span>'
        + '</div>'
        + '<div style="font-size:0.85rem;color:#e7e9ea">'
        + (a.target_type ? a.target_type + ' #' + a.target_id : '')
        + (a.details ? ' — ' + escHtml(a.details) : '')
        + '</div>'
        + '</div>';
    }
    const totalPages = Math.ceil(d.total / 10);
    el.innerHTML = cards;
    pagination.innerHTML = '<button onclick="stabActivityPage--;loadSettingsActivity()"' + (stabActivityPage <= 1 ? ' disabled' : '') + '>Prev</button>'
      + '<span class="page-info">Page ' + stabActivityPage + ' of ' + totalPages + '</span>'
      + '<button onclick="stabActivityPage++;loadSettingsActivity()"' + (stabActivityPage >= totalPages ? ' disabled' : '') + '>Next</button>';
  } catch(e) {
    el.innerHTML = '<div class="empty-state" style="color:#f4212e">Failed to load activity</div>';
    pagination.innerHTML = '';
  }
}

async function loadUsers() {
  const el = document.getElementById('tabUsers');

      + '<button class="btn-small primary" onclick="syncAllUsers()" style="padding:6px 14px">Sync All</button>'
      + '<span id="syncMsg" style="font-size:0.8rem;color:#71767b"></span>'
      + '<input id="usersSearchInput" placeholder="Search username..." value="' + escHtml(usersSearch) + '"'
      + ' onkeydown="if(event.key===\'Enter\'){usersSearch=this.value;usersPage=1;loadUsers()}"'
      + ' style="margin-left:auto;background:#0e0e12;border:1px solid #2f3336;border-radius:8px;color:#e7e9ea;padding:6px 10px;font-size:0.8rem;outline:none;width:180px">'
      + '<button class="btn-small primary" onclick="usersSearch=document.getElementById(\'usersSearchInput\').value;usersPage=1;loadUsers()">Search</button>'
      + '</div>';

    if (users.length === 0) {
      html += '<div class="empty-state">No users yet</div>';
      el.innerHTML = html;

    let cards = '';
    for (const u of users) {
      const followsClass = u.we_follow ? 'status-approved' : 'status-rejected';
      const followsText = u.we_follow ? 'Yes' : 'No';
      const fbClass = u.follows_us ? 'status-approved' : 'status-rejected';
      const fbText = u.follows_us ? 'Yes' : 'No';
      const blockedClass = u.blocked ? 'status-rejected' : 'status-approved';
      const blockedText = u.blocked ? 'Blocked' : 'Not blocked';
      const statusClass = u.status === 'inactive' ? 'status-rejected' : 'status-approved';
      const statusText = u.status === 'inactive' ? 'Inactive' : 'Active';
      cards += '<div class="item-card">'
        + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">'
        + '<div style="width:40px;height:40px;border-radius:50%;overflow:hidden;background:#2f3336;flex-shrink:0">'
        + (u.avatar_url ? '<img src="' + u.avatar_url + '" style="width:100%;height:100%;object-fit:cover">' : '')
        + '</div>'
        + '<div style="flex:1">'
        + '<div><a href="javascript:void(0)" onclick="showUserTweets(' + u.id + ')" style="color:#1d9bf0;text-decoration:none;font-weight:500">@' + escHtml(u.screen_name) + '</a>'
        + '</div>'
        + '<div style="font-size:0.8rem;color:#71767b">' + escHtml(u.name || '-') + '</div>'
        + '</div>'
        + '</div>'
        + '<div class="meta" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">'
        + '<span class="status-badge ' + followsClass + '">Follows us: ' + followsText + '</span>'
        + '<span class="status-badge ' + fbClass + '">Followed back: ' + fbText + '</span>'
        + '<span class="status-badge ' + blockedClass + '">' + blockedText + '</span>'
        + '<span class="status-badge ' + statusClass + '">' + statusText + '</span>'
        + '</div>'
        + '<div class="meta" style="display:flex;gap:12px;flex-wrap:wrap;font-size:0.75rem;color:#71767b">'
        + '<span>Last login: ' + fmtTime(u.last_login_at) + '</span>'
        + '</div>'
        + '<div class="actions" style="margin-top:8px">'
        + (u.blocked
            ? '<button class="btn-action btn-approve" onclick="unblockUser(' + u.id + ')">Unblock</button>'
            : '<button class="btn-action btn-reject" onclick="blockUser(' + u.id + ')">Block</button>')
        + (u.follows_us
            ? '<button class="btn-action btn-reject" onclick="unfollowUser(' + u.id + ')">Unfollow</button>'
            : '<button class="btn-action btn-approve" onclick="followUser(' + u.id + ')">Follow</button>')
        + '</div></div>';
    }

    const totalPages = Math.ceil((d.total || users.length) / 20);
    html += cards
      + '<div class="pagination">'
      + '<button onclick="usersPage--;loadUsers()"' + (usersPage <= 1 ? ' disabled' : '') + '>Prev</button>'
      + '<span class="page-info">Page ' + usersPage + ' of ' + totalPages + '</span>'
      + '<button onclick="usersPage++;loadUsers()"' + (usersPage >= totalPages ? ' disabled' : '') + '>Next</button>'
      + '</div>';

    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = '<div class="empty-state" style="color:#f4212e">Failed to load users</div>';
  }
}

async function followUser(id) {
  try {
    const r = await api('/panel/api/x-users/' + id + '/follow', { method: 'POST' });
    const d = await r.json();
    if (d.success) { loadUsers(); loadStats(); }
    else { showPopup('⚠️', 'Follow Failed', d.error || 'Failed to follow user', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]); }
  } catch(e) { showPopup('⚠️', 'Error', 'Connection error', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]); }
}

async function unfollowUser(id) {
  showPopup('', 'Unfollow?', 'Unfollow this user?', [
    { text: 'Cancel', cls: 'popup-btn-ghost', fn: closePopup },
    { text: 'Unfollow', cls: 'popup-btn-danger', fn: async () => {
      closePopup();
      try {
        const r = await api('/panel/api/x-users/' + id + '/unfollow', { method: 'POST' });
        const d = await r.json();
        if (d.success) { loadUsers(); loadStats(); }
        else { showPopup('⚠️', 'Unfollow Failed', d.error || 'Failed to unfollow', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]); }
      } catch(e) { showPopup('⚠️', 'Error', 'Connection error', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]); }
    } },
  ]);
}

async function blockUser(id) {
  showPopup('', 'Block User?', 'Block this user from using the application?', [
    { text: 'Cancel', cls: 'popup-btn-ghost', fn: closePopup },
    { text: 'Block', cls: 'popup-btn-danger', fn: async () => {
      closePopup();
      try {
        const r = await api('/panel/api/x-users/' + id + '/block', { method: 'POST' });
        const d = await r.json();
        if (d.success) { loadUsers(); }
        else { showPopup('⚠️', 'Block Failed', 'Failed to block user', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]); }
      } catch(e) { showPopup('⚠️', 'Error', 'Connection error', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]); }
    } },
  ]);
}

async function unblockUser(id) {
  try {
    const r = await api('/panel/api/x-users/' + id + '/unblock', { method: 'POST' });
    const d = await r.json();
    if (d.success) { loadUsers(); }
    else { showPopup('⚠️', 'Unblock Failed', 'Failed to unblock user', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]); }
  } catch(e) { showPopup('⚠️', 'Error', 'Connection error', [{ text: 'OK', cls: 'popup-btn-ghost', fn: closePopup }]); }
}

async function syncAllUsers() {
  const msg = document.getElementById('syncMsg');
  if (msg) msg.textContent = 'Syncing...';
  try {
    await api('/panel/api/x-users/sync-all', { method: 'POST' });
    const poll = setInterval(async () => {
      try {
        const r = await api('/panel/api/x-users/sync-status');
        const d = await r.json();
        if (d.status === 'done') {
          clearInterval(poll);
          if (msg) msg.textContent = 'Synced: ' + d.synced + ', errors: ' + d.errors;
          loadUsers();
          loadStats();
        } else if (d.status === 'running') {
          if (msg) msg.textContent = 'Syncing... ' + (d.synced + d.errors) + '/' + d.total;
        }
      } catch { clearInterval(poll); if (msg) msg.textContent = 'Sync failed'; }
    }, 2000);
  } catch(e) {
    if (msg) msg.textContent = 'Sync failed';
  }
}

// ─── Tab Switching ────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelector('.tab[data-tab="' + name + '"]').classList.add('active');
  const tabEl = document.getElementById('tab' + name.charAt(0).toUpperCase() + name.slice(1));
  tabEl.classList.add('active');

  // Show loading placeholder immediately
  if (name !== 'settings') {
    tabEl.innerHTML = '<div class="empty-state" style="color:#71767b">Loading...</div>';
  }

  if (name === 'queue') loadQueue();
  if (name === 'history') loadHistory();
  if (name === 'users') loadUsers();
  if (name === 'settings') loadSettings();
}

// ─── SSE Events ────────────────────────────────────────────
function connectSSE() {
  const es = new EventSource('/panel/api/events?token=' + TOKEN);

  es.addEventListener('new_tweet', (e) => {
    const d = JSON.parse(e.data);
    const badge = document.getElementById('queueBadge');
    badge.textContent = parseInt(badge.textContent || '0') + 1;

    const active = document.querySelector('.tab-content.active');
    if (active && active.id === 'tabQueue' && queuePage === 1) {
      const el = document.getElementById('tabQueue');
      const empty = el.querySelector('.empty-state');
      const card = document.createElement('div');
      card.className = 'item-card';
      card.id = 'qt-' + d.id;
      const isCard = d.send_as_image;
      const displayText = d.original_text || '';
      const displayFull = d.original_text || '';
      var tagHtml = '';
      if (isCard) {
        tagHtml = '<span class="img-tag card-tag">Card</span>';
      } else if (d.image_paths && d.image_paths.length) {
        tagHtml = '<span class="img-tag media-tag">' + d.image_paths.length + ' image' + (d.image_paths.length > 1 ? 's' : '') + '</span>';
      }
      const metaParts = [fmtTime(d.submitted_at)];
      if (d.chunk_count > 1) metaParts.push(d.chunk_count + ' tweets');
      const metaStr = '<strong>#' + d.id + '</strong>' + (metaParts.length ? ' · ' + metaParts.join(' · ') : '');
      const userHtml = d.user_screen_name && d.x_user_db_id
        ? '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">'
          + '<div style="width:32px;height:32px;border-radius:50%;overflow:hidden;background:#2f3336;flex-shrink:0">'
          + (d.user_avatar_url ? '<img src="' + d.user_avatar_url + '" style="width:100%;height:100%;object-fit:cover">' : '')
          + '</div>'
          + '<div style="flex:1;min-width:0">'
          + '<div style="font-size:0.85rem;font-weight:500;color:#1d9bf0;cursor:pointer" onclick="showUserTweets(' + d.x_user_db_id + ')">@' + escHtml(d.user_screen_name) + '</div>'
          + '<div class="meta">' + metaStr + '</div>'
          + '</div>'
          + '</div>'
        : '<div class="meta" style="margin-bottom:10px">' + metaStr + '</div>';
      const thumbsHtml = (d.image_paths && d.image_paths.length)
        ? function() {
            const fns = d.image_paths.map(filenameFromPath);
            const fnsJson = JSON.stringify(fns);
            return '<div class="thumb-grid">' + fns.map((fn, idx) => {
              return '<div class="thumb" onclick=\'openLightbox(' + fnsJson + ',' + idx + ')\'><img src="/panel/api/images/' + fn + '?token=' + TOKEN + '"></div>';
            }).join('') + '</div>';
          }()
        : '';
      card.innerHTML = userHtml + thumbsHtml
        + '<div class="text" data-full="' + escHtml(displayFull).replace(/"/g, '&quot;') + '" onclick="showFullFromAttr(this)" style="cursor:pointer">' + escHtml(displayText) + '</div>'
        + '<div class="actions" id="qa-' + d.id + '">'
        + '<button class="btn-action btn-approve" onclick="approveTweet(' + d.id + ')">Approve</button>'
        + '<button class="btn-action btn-reject" onclick="rejectTweetPopup(' + d.id + ')">Reject</button>'
        + '</div>';
      if (empty) {
        el.innerHTML = '';
        el.appendChild(card);
      } else {
        const pages = el.querySelector('.pagination');
        if (pages) {
          el.insertBefore(card, pages);
        } else {
          el.insertBefore(card, el.firstChild);
        }
      }
    }
  });

  es.addEventListener('tweet_updated', (e) => {
    const d = JSON.parse(e.data);
    if (d.status !== 'partial') {
      const card = document.getElementById('qt-' + d.id);
      if (card) card.style.display = 'none';
    }
    loadStats();
    loadQueue();
  });

  es.addEventListener('status_changed', (e) => {
    loadStats();
  });

  es.addEventListener('announcement_changed', (e) => {
    loadStats();
  });

  es.addEventListener('user_status_changed', () => {
    const usersTab = document.getElementById('tabUsers');
    if (usersTab && usersTab.classList.contains('active')) {
      loadUsers();
    }
  });

  es.addEventListener('sync_progress', (e) => {
    const d = JSON.parse(e.data);
    const msg = document.getElementById('syncMsg');
    if (!msg) return;
    if (d.status === 'running') {
      msg.textContent = 'Syncing... ' + (d.synced + d.errors) + '/' + d.total;
    } else if (d.status === 'done') {
      msg.textContent = 'Synced: ' + d.synced + ', errors: ' + d.errors;
      loadUsers();
      loadStats();
    }
  });

  es.addEventListener('keyword_updated', () => {
    const stabService = document.getElementById('stabService');
    if (stabService && !stabService.classList.contains('hidden')) {
      loadKeywordsSection();
    }
  });

  es.addEventListener('admin_updated', () => {
    if (ADMIN.role === 'superadmin') {
      const stabGeneral = document.getElementById('stabGeneral');
      if (stabGeneral && !stabGeneral.classList.contains('hidden')) {
        loadAdminsSection();
      }
    }
  });

  es.addEventListener('task_progress', (e) => {
    const d = JSON.parse(e.data);
    if (d.task_id !== _currentTaskId) return;
    if (d.status === 'done') {
      _handleTaskDone(d);
    } else {
      const pct = d.total > 0 ? Math.round((d.progress || 0) / d.total * 100) : 0;
      document.getElementById('progressBar').style.width = Math.min(pct, 95) + '%';
      document.getElementById('loadingText').textContent = d.message || 'Working...';
    }
  });

  es.onerror = () => {
    es.close();
    try {
      const b64 = TOKEN.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      const payload = JSON.parse(atob(b64));
      if (payload.type !== 'admin' || (payload.exp && payload.exp * 1000 < Date.now())) {
        logout();
        return;
      }
    } catch (_) {}
    setTimeout(connectSSE, 3000);
  };
}

// ─── Init & Auto-refresh ──────────────────────────────────
loadStats();
loadQueue();
connectSSE();
</script>
