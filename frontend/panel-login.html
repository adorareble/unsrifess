<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel — Unsr!fess</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0e0e12; color: #e7e9ea; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .container { width: 100%; max-width: 380px; padding: 20px; }
  h1 {
    font-size: 1.3rem; font-weight: 700; margin-bottom: 4px;
    background: linear-gradient(135deg, #1d9bf0, #8b5cf6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; text-align: center;
  }
  .subtitle { font-size: 0.8rem; color: #71767b; margin-bottom: 24px; text-align: center; }
  .card {
    background: #1a1a24; border: 1px solid #2a2a38; border-radius: 16px; padding: 24px;
  }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.8rem; color: #71767b; margin-bottom: 6px; }
  .field input {
    width: 100%; background: #0e0e12; border: 1px solid #2a2a38;
    border-radius: 8px; color: #e7e9ea; font-size: 0.9rem;
    padding: 10px 12px; outline: none; font-family: inherit;
  }
  .field input:focus { border-color: #1d9bf0; }
  .btn {
    width: 100%; padding: 12px; border: none; border-radius: 10px;
    color: #fff; font-size: 0.95rem; font-weight: 600;
    cursor: pointer; margin-top: 6px; background: #1d9bf0;
  }
  .btn:hover { background: #1a8cd8; }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .msg { font-size: 0.8rem; min-height: 1.2em; margin-top: 10px; text-align: center; }
  .msg.err { color: #f4212e; }
  .msg.ok { color: #00ba7c; }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid #2a2a38; border-top-color: #fff; border-radius: 50%;
    animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  a.back { display: block; text-align: center; margin-top: 16px; color: #71767b; font-size: 0.8rem; text-decoration: none; }
  a.back:hover { color: #1d9bf0; }
</style>
</head>
<body>
<div class="container">
  <h1>Unsr!fess Panel</h1>
  <div class="subtitle">Admin login</div>
  <div class="card">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password">
    </div>
    <button class="btn" id="loginBtn" onclick="login()">Log in</button>
    <div class="msg" id="msg"></div>
  </div>
  <a class="back" href="/">&larr; Back</a>
</div>

<script>
const token = localStorage.getItem('panel_token');
if (token) {
  fetch('/panel/api/me', { headers: { 'Authorization': 'Bearer ' + token } })
    .then(r => { if (r.ok) window.location.href = '/panel/dashboard'; })
    .catch(() => {});
}

async function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('msg');

  if (!username || !password) {
    msg.className = 'msg err';
    msg.textContent = 'Enter username and password';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Logging in...';
  msg.className = 'msg';
  msg.textContent = '';

  try {
    const form = new FormData();
    form.append('username', username);
    form.append('password', password);
    const r = await fetch('/panel/api/login', { method: 'POST', body: form });
    const data = await r.json();
    if (data.token) {
      localStorage.setItem('panel_token', data.token);
      localStorage.setItem('panel_admin', JSON.stringify(data.admin));
      msg.className = 'msg ok';
      msg.textContent = 'Login successful. Redirecting...';
      window.location.href = '/panel/dashboard';
    } else {
      msg.className = 'msg err';
      msg.textContent = data.detail || 'Login failed';
    }
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = 'Connection error';
  }
  btn.disabled = false;
  btn.textContent = 'Log in';
}

document.getElementById('password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') login();
});
</script>
</body>
</html>
