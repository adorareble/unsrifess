<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta property="og:title" content="fessable">
<meta property="og:description" content="Confess anonymously on X — fessable">
<meta property="og:type" content="website">
<meta property="og:image" content="/static/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="fessable">
<meta name="twitter:description" content="Confess anonymously on X">
<meta name="twitter:image" content="/static/og-image.png">
<link rel="icon" type="image/png" href="/static/favicon-32x32.png">
<link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<title>Panel — fessable</title>
<style>
  :root{--bg-page:#FAFAF9;--bg-surface:#F1EFE8;--bg-card:#FFFFFF;--text-primary:#2C2C2A;--text-secondary:#888780;--text-hint:#B4B2A9;--border:#D3D1C7;--red:#E24B4A;--red-tint:#FAECE7;--red-text:#A32D2D;--amber:#EF9F27;--amber-tint:#FAEEDA;--amber-text:#854F0B;--teal:#1D9E75;--teal-tint:#EAF3DE;--teal-text:#0F6E56}
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #FAFAF9; color: #2C2C2A; min-height: 100vh; min-height: 100dvh;
    display: flex; justify-content: center;
  }
  .container { width: 100%; max-width: 480px; padding: 24px 16px; display: flex; flex-direction: column; justify-content: center; min-height: 100dvh; }
  h1 {
    font-size: 1.3rem; font-weight: 700; margin-bottom: 4px;
    color: #2C2C2A; text-align: center;
  }
  .subtitle { font-size: 0.8rem; color: #888780; margin-bottom: 24px; text-align: center; }
  .card {
    background: #F1EFE8; border: 1px solid #D3D1C7; border-radius: 20px; padding: 24px 20px;
  }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.8rem; color: #888780; margin-bottom: 6px; }
  .field input {
    width: 100%; background: #FFFFFF; border: 1px solid #D3D1C7;
    border-radius: 14px; color: #2C2C2A; font-size: 1rem;
    padding: 14px; outline: none; font-family: inherit;
  }
  .field input:focus { border-color: #2C2C2A; }
  .btn {
    width: 100%; padding: 14px; border: none; border-radius: 9999px;
    color: #FAFAF9; font-size: 1rem; font-weight: 600;
    cursor: pointer; margin-top: 6px; background: #2C2C2A; transition: opacity .2s;
  }
  .btn:hover { opacity: .85; }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .msg { font-size: 0.8rem; min-height: 1.2em; margin-top: 10px; text-align: center; }
  .msg.err { color: #E24B4A; }
  .msg.ok { color: #1D9E75; }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid #D3D1C7; border-top-color: #2C2C2A; border-radius: 50%;
    animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  a.back { display: block; text-align: center; margin-top: 16px; color: #888780; font-size: 0.8rem; text-decoration: none; }
  a.back:hover { color: #2C2C2A; }
</style>
</head>
<body>
<div class="container">
  <h1>fessable Panel</h1>
  <div class="subtitle">Admin login</div>
  <div class="card">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password">
    </div>
    <button class="btn" id="loginBtn" onclick="login()">Log in</button>
    <div class="msg" id="msg"></div>
  </div>
  <a class="back" href="/">&larr; Back</a>
</div>
<script>
const token = localStorage.getItem('panel_token');
if (token) {
  fetch('/panel/api/me', { headers: { 'Authorization': 'Bearer ' + token } })
    .then(r => { if (r.ok) window.location.href = '/panel/dashboard'; })
    .catch(() => {});
}

async function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('msg');

  if (!username || !password) {
    msg.className = 'msg err';
    msg.textContent = 'Enter username and password';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Logging in...';
  msg.className = 'msg';
  msg.textContent = '';

  try {
    const form = new FormData();
    form.append('username', username);
    form.append('password', password);
    const r = await fetch('/panel/api/login', { method: 'POST', body: form });
    const data = await r.json();
    if (data.token) {
      localStorage.setItem('panel_token', data.token);
      localStorage.setItem('panel_admin', JSON.stringify(data.admin));
      msg.className = 'msg ok';
      msg.textContent = 'Login successful. Redirecting...';
      window.location.href = '/panel/dashboard';
    } else {
      msg.className = 'msg err';
      msg.textContent = data.detail || 'Login failed';
    }
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = 'Connection error';
  }
  btn.disabled = false;
  btn.textContent = 'Log in';
}

document.getElementById('password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') login();
});
</script>
</body>
</html>
