<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Admin Login — fessable</title>
<style>
  :root{--bg-page:#FAFAF9;--bg-surface:#F1EFE8;--bg-card:#FFFFFF;--text-primary:#2C2C2A;--text-secondary:#888780;--text-hint:#B4B2A9;--border:#D3D1C7;--red:#E24B4A;--red-tint:#FAECE7;--red-text:#A32D2D;--amber:#EF9F27;--amber-tint:#FAEEDA;--amber-text:#854F0B;--teal:#1D9E75;--teal-tint:#EAF3DE;--teal-text:#0F6E56}
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: var(--bg-page); color: var(--text-primary); min-height: 100dvh;
    display: flex; justify-content: center;
  }
  .container { width: 100%; max-width: 400px; padding: 24px 16px; display: flex; flex-direction: column; justify-content: center; min-height: 100dvh; }
  .logo-wrap { text-align: center; margin-bottom: 20px; }
  h1 {
    font-size: 18px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px;
    color: var(--text-primary); text-align: center;
  }
  .subtitle { font-size: 13px; color: var(--text-secondary); margin-bottom: 24px; text-align: center; }
  .card {
    background: var(--bg-card); border: 0.5px solid var(--border); border-radius: 14px; padding: 24px 20px;
  }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 6px; }
  .field input {
    width: 100%; background: var(--bg-surface); border: 0.5px solid var(--border);
    border-radius: 10px; color: var(--text-primary); font-size: 13px;
    padding: 10px 12px; outline: none; font-family: inherit; transition: border-color .2s;
  }
  .field input:focus { border-color: var(--text-primary); }
  .btn {
    width: 100%; padding: 13px 16px; border: none; border-radius: 12px;
    color: var(--bg-page); font-size: 14px; font-weight: 700;
    cursor: pointer; margin-top: 6px; background: var(--text-primary); font-family: inherit; transition: opacity .2s;
  }
  .btn:hover { opacity: .85; }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .msg { font-size: 13px; min-height: 1.2em; margin-top: 10px; text-align: center; }
  .msg.err { color: var(--red); }
  .msg.ok { color: var(--teal); }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--border); border-top-color: var(--red); border-radius: 50%;
    animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  a.back { display: block; text-align: center; margin-top: 16px; color: var(--text-secondary); font-size: 13px; text-decoration: none; }
  a.back:hover { color: var(--text-primary); }
</style>
</head>
<body>
<div class="container">
  <div class="logo-wrap">
    <svg width="40" height="40" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <rect x="4" y="4" width="56" height="44" rx="14" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="3"/>
      <path d="M14,48 L8,60 L26,48 Z" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="3" stroke-linejoin="round"/>
      <line x1="15" y1="47.2" x2="25" y2="47.2" stroke="#F1EFE8" stroke-width="5"/>
      <circle cx="22" cy="26" r="6" fill="#E24B4A"/>
      <circle cx="32" cy="26" r="6" fill="#EF9F27"/>
      <circle cx="42" cy="26" r="6" fill="#1D9E75"/>
    </svg>
  </div>
  <h1>fessable</h1>
  <div class="subtitle">Login to manage your service</div>
  <div class="card">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password">
    </div>
    <button class="btn" id="loginBtn" onclick="login()">Log in</button>
    <div class="msg" id="msg"></div>
  </div>
  <a class="back" href="/">&larr; Back</a>
</div>
<script>
async function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('msg');

  if (!username || !password) {
    msg.className = 'msg err';
    msg.textContent = 'Enter username and password';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Logging in...';
  msg.className = 'msg';
  msg.textContent = '';

  try {
    const form = new URLSearchParams();
    form.append('username', username);
    form.append('password', password);
    const r = await fetch('/api/admin-login', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: form.toString() });
    if (!r.ok) {
      let d;
      try { d = await r.json(); } catch(e) { d = {}; }
      msg.className = 'msg err';
      msg.textContent = d.detail || 'Login failed (' + r.status + ')';
      btn.disabled = false;
      btn.textContent = 'Log in';
      return;
    }
    const d = await r.json();
    localStorage.setItem('panel_token', d.token);
    localStorage.setItem('panel_admin', JSON.stringify(d.admin));
    if (d.is_root) {
      localStorage.setItem('admin_token', d.token);
      localStorage.setItem('admin_role', d.admin.role);
      msg.className = 'msg ok';
      msg.textContent = 'Login successful. Redirecting...';
      window.location.href = '/panel/admin/dashboard';
    } else {
      msg.className = 'msg ok';
      msg.textContent = 'Login successful. Redirecting...';
      window.location.href = '/' + d.slug + '/panel/dashboard';
    }
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = 'Connection error';
  }
  btn.disabled = false;
  btn.textContent = 'Log in';
}

document.getElementById('password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') login();
});
</script>
</body>
</html>
