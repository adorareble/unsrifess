<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta property="og:title" content="Register — fessable">
<meta property="og:description" content="Create your own anonymous confession service">
<meta property="og:type" content="website">
<meta property="og:image" content="/static/og-image.png">
<meta name="theme-color" content="#FAFAF9">
<title>Register — fessable</title>
<style>
  :root{--bg-page:#FAFAF9;--bg-surface:#F1EFE8;--bg-card:#FFFFFF;--text-primary:#2C2C2A;--text-secondary:#888780;--text-hint:#B4B2A9;--border:#D3D1C7;--red:#E24B4A;--red-tint:#FAECE7;--red-text:#A32D2D;--amber:#EF9F27;--amber-tint:#FAEEDA;--amber-text:#854F0B;--teal:#1D9E75;--teal-tint:#EAF3DE;--teal-text:#0F6E56}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg-page);color:var(--text-primary);min-height:100dvh;display:flex;flex-direction:column;align-items:center}
  .topbar{flex:none;width:100%;display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:0.5px solid var(--border)}
  .topbar .wordmark{font-size:15px;font-weight:700;color:var(--text-primary)}
  .card-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 16px;width:100%}
  .card{background:var(--bg-card);border:0.5px solid var(--border);border-radius:14px;padding:24px 20px;max-width:400px;width:100%}
  h1{font-size:18px;font-weight:700;letter-spacing:-0.5px;margin-bottom:4px}
  .sub{font-size:13px;color:var(--text-secondary);margin-bottom:24px}
  label{display:block;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;color:var(--text-secondary)}
  input{width:100%;padding:10px 12px;margin-bottom:16px;background:var(--bg-surface);border:0.5px solid var(--border);border-radius:10px;color:var(--text-primary);font-size:13px;font-family:inherit;outline:none;transition:border-color .2s}
  input:focus{border-color:var(--text-primary)}
  .hint{font-size:11px;color:var(--text-hint);margin-top:-12px;margin-bottom:16px}
  .error{color:var(--red);font-size:13px;margin-bottom:12px;display:none}
  .success{color:var(--teal);font-size:13px;margin-bottom:12px;display:none}
  button{width:100%;padding:13px 16px;background:var(--text-primary);color:var(--bg-page);border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .2s}
  button:hover{opacity:.85}
  button:disabled{opacity:.3;cursor:not-allowed}
  .footer{text-align:center;margin-top:20px;font-size:11px;color:var(--text-hint)}
  .footer a{color:var(--text-secondary);text-decoration:none}
  .footer a:hover{color:var(--text-primary)}
  .spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="topbar">
  <svg width="24" height="24" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <rect x="4" y="4" width="56" height="44" rx="14" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="3"/>
    <path d="M14,48 L8,60 L26,48 Z" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="3" stroke-linejoin="round"/>
    <line x1="15" y1="47.2" x2="25" y2="47.2" stroke="#F1EFE8" stroke-width="5"/>
    <circle cx="22" cy="26" r="6" fill="#E24B4A"/>
    <circle cx="32" cy="26" r="6" fill="#EF9F27"/>
    <circle cx="42" cy="26" r="6" fill="#1D9E75"/>
  </svg>
  <span class="wordmark">fessable</span>
</div>
<div class="card-wrap">
<div class="card">
<h1>Create Your Service</h1>
<div class="sub">Set up your own anonymous confession service in seconds.</div>
<div class="error" id="errorMsg"></div>
<div class="success" id="successMsg"></div>
<form id="registerForm" onsubmit="handleRegister(event)">
  <label for="name">Service Name</label>
  <input type="text" id="name" placeholder="e.g. My Confessions" required autocomplete="off">
  <div class="hint">Your service name will appear in the header.</div>

  <label for="slug">URL Slug</label>
  <input type="text" id="slug" placeholder="e.g. my-confessions" required autocomplete="off" pattern="[a-z0-9-]+">
  <div class="hint">Your page will be at <span id="slugPreview">/slug</span></div>

  <label for="xScreen">X Handle (optional)</label>
  <input type="text" id="xScreen" placeholder="e.g. myxhandle" autocomplete="off">
  <div class="hint">Your X account to follow-back confessors.</div>

  <label for="adminUser">Admin Username</label>
  <input type="text" id="adminUser" placeholder="e.g. admin" required autocomplete="off">

  <label for="adminPass">Admin Password</label>
  <input type="password" id="adminPass" placeholder="Min 6 characters" required minlength="6">

  <label for="adminDisplay">Admin Display Name</label>
  <input type="text" id="adminDisplay" placeholder="e.g. Admin" required autocomplete="off">

  <button type="submit" id="submitBtn">Create Service</button>
</form>
<div class="footer"></div>
</div>
</div>
<script>
document.getElementById('slug').addEventListener('input', function() {
  this.value = this.value.toLowerCase().replace(/[^a-z0-9-]/g, '');
  document.getElementById('slugPreview').textContent = '/' + this.value;
});
document.getElementById('name').addEventListener('input', function() {
  const slug = document.getElementById('slug');
  if (!slug.value) {
    slug.value = this.value.toLowerCase().replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
    document.getElementById('slugPreview').textContent = '/' + slug.value;
  }
});

async function handleRegister(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('errorMsg');
  const success = document.getElementById('successMsg');
  err.style.display = 'none';
  success.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Creating...';

  const form = document.getElementById('registerForm');
  const data = new URLSearchParams();
  data.append('name', document.getElementById('name').value.trim());
  data.append('slug', document.getElementById('slug').value.trim());
  data.append('x_screen_name', document.getElementById('xScreen').value.trim());
  data.append('admin_username', document.getElementById('adminUser').value.trim());
  data.append('admin_password', document.getElementById('adminPass').value);
  data.append('admin_display_name', document.getElementById('adminDisplay').value.trim());

  try {
    const resp = await fetch('/api/register', { method: 'POST', body: data });
    const result = await resp.json();
    if (!resp.ok) {
      err.textContent = result.detail || 'Registration failed';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Create Service';
      return;
    }
    success.innerHTML = 'Service created! <a href="/' + result.slug + '/panel/login" style="color:#2C2C2A">Go to panel →</a>';
    success.style.display = 'block';
    form.style.display = 'none';
  } catch(e) {
    err.textContent = 'Network error. Please try again.';
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Create Service';
  }
}
</script>
</body>
</html>
